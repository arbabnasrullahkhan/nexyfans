<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Cinema - Nexy Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --accent: #6366f1;
            --bg: #0f172a; /* Dark mode for cinema feel */
            --card: #1e293b;
            --glass: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* --- LUXURY PLAYER SECTION --- */
        .player-section {
            width: 100%;
            background: #000;
            position: sticky;
            top: 0;
            z-index: 1000;
            aspect-ratio: 16/9;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        @media (min-width: 1024px) {
            .player-section {
                height: 70vh;
                position: relative;
            }
        }

        #mainVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Custom Controls Overlay */
        .player-controls {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            padding: 20px;
            background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            display: flex; flex-direction: column; gap: 10px;
            opacity: 0; transition: opacity 0.3s;
        }
        .player-section:hover .player-controls { opacity: 1; }

        .progress-bar {
            width: 100%; height: 6px; background: rgba(255,255,255,0.2);
            border-radius: 10px; cursor: pointer; position: relative;
        }
        .progress-fill {
            width: 0%; height: 100%; background: var(--accent); border-radius: 10px;
        }

        .control-btns { display: flex; align-items: center; justify-content: space-between; }
        .btns-left { display: flex; align-items: center; gap: 20px; }
        .control-btns svg { width: 24px; fill: white; cursor: pointer; }

        /* --- CONTENT LAYOUT --- */
        .main-layout {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        @media (min-width: 1024px) {
            .main-layout { grid-template-columns: 1fr 380px; }
        }

        /* Video Info */
        .video-details h1 { font-size: 22px; font-weight: 800; margin-bottom: 12px; line-height: 1.3; }
        .stats-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .views-count { font-size: 14px; color: #94a3b8; font-weight: 600; }
        
        .interaction-btns { display: flex; gap: 15px; }
        .action-btn {
            padding: 10px 20px; border-radius: 30px; background: var(--card);
            border: 1px solid rgba(255,255,255,0.1); color: white;
            font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .action-btn.liked { background: white; color: black; }
        .action-btn.liked svg { fill: black; }

        /* Uploader Profile */
        .uploader-box {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 0;
        }
        .profile-info { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 20px; }
        .follow-btn { padding: 10px 25px; border-radius: 14px; background: white; color: black; font-weight: 800; border: none; cursor: pointer; }

        .description-box {
            background: var(--card); padding: 20px; border-radius: 20px;
            font-size: 14px; line-height: 1.6; color: #cbd5e1;
        }

        /* --- RELATED CONTENT --- */
        .related-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .related-list { display: flex; flex-direction: column; gap: 15px; }

        .related-card {
            display: flex; gap: 12px; cursor: pointer; transition: var(--transition);
        }
        .related-card:hover { opacity: 0.8; }
        .thumb-mini { width: 140px; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; flex-shrink: 0; }
        .thumb-mini img { width: 100%; height: 100%; object-fit: cover; }
        .related-info h4 { font-size: 14px; font-weight: 700; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .related-info p { font-size: 12px; color: #94a3b8; }

        /* Ad Placement */
        .cinema-ad {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border-radius: 20px; padding: 20px; margin-bottom: 20px; text-align: center;
        }
    </style>
</head>
<body>

    <div id="loaderContainer"></div>

    <!-- Player -->
    <section class="player-section" id="playerArea">
        <video id="mainVideo" playsinline poster="">
            <source src="" type="video/mp4">
        </video>

        <!-- Luxury Controls -->
        <div class="player-controls">
            <div class="progress-bar" id="progressContainer">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="control-btns">
                <div class="btns-left">
                    <svg id="playPauseBtn" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                </div>
                <div class="btns-right">
                    <svg id="fullscreenBtn" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Grid -->
    <main class="main-layout">
        <!-- Video Content -->
        <div class="video-content">
            <div class="video-details">
                <h1 id="videoTitle">Loading Elite Content...</h1>
                <div class="stats-bar">
                    <span class="views-count" id="videoStats">0 views • Joined Nexy Hub</span>
                    <div class="interaction-btns">
                        <button class="action-btn" id="likeBtn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></button>
                            <span id="likeCount">0</span>
                        </button>
                        <button class="action-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                            Share
                        </button>
                    </div>
                </div>

                <div class="uploader-box">
                    <div class="profile-info">
                        <div class="avatar" id="uploaderAvatar">U</div>
                        <div>
                            <h4 id="uploaderName" style="font-weight: 800;">Elite Creator</h4>
                            <p style="font-size: 12px; color: #94a3b8;">Verified Member</p>
                        </div>
                    </div>
                    <button class="follow-btn">Elite Plus</button>
                </div>

                <div class="description-box" id="videoDesc">
                    Select a video to experience the full Nexy Hub cinema. Premium user-generated content awaits you.
                </div>
            </div>
        </div>

        <!-- Sidebar (Related) -->
        <aside class="sidebar">
            <div class="cinema-ad">
                <h3 style="font-size: 16px; font-weight: 800;">Unlock Nexy 4K</h3>
                <p style="font-size: 12px; margin-top: 5px;">Stream without interruptions.</p>
            </div>

            <div class="related-title">
                <svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
                Watch Next
            </div>

            <div class="related-list" id="relatedList">
                <!-- Related videos go here -->
            </div>
        </aside>
    </main>

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, collection, query, limit, getDocs, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db } from "./imp/firebase-config.js";

        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');

        // 1. Auth & Load Video
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.replace("login.html");
            else if (videoId) loadVideoDetails(videoId);
            else window.location.replace("home.html");
        });

        async function loadVideoDetails(id) {
            const videoSnap = await getDoc(doc(db, "videos", id));
            if (videoSnap.exists()) {
                const data = videoSnap.data();
                
                // Update UI
                document.getElementById('mainVideo').src = data.videoURL;
                document.getElementById('videoTitle').innerText = data.title;
                document.getElementById('uploaderName').innerText = data.username;
                document.getElementById('uploaderAvatar').innerText = data.username.charAt(0);
                document.getElementById('videoStats').innerText = `${data.views || 0} views • Elite Member`;
                document.getElementById('likeCount').innerText = data.likes || 0;
                document.getElementById('videoDesc').innerText = data.description || "No elite description provided.";

                // Increment View
                updateDoc(doc(db, "videos", id), { views: increment(1) });
                
                fetchRelated();
            }
        }

        // 2. Custom Player Controls
        const video = document.getElementById('mainVideo');
        const playBtn = document.getElementById('playPauseBtn');
        const progress = document.getElementById('progressFill');

        playBtn.onclick = () => {
            if (video.paused) {
                video.play();
                playBtn.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            } else {
                video.pause();
                playBtn.innerHTML = '<path d="M8 5v14l11-7z"/>';
            }
        };

        video.ontimeupdate = () => {
            const perc = (video.currentTime / video.duration) * 100;
            progress.style.width = perc + '%';
        };

        // 3. Swipe Up/Down Navigation (Mobile)
        let touchStart = 0;
        document.getElementById('playerArea').addEventListener('touchstart', e => {
            touchStart = e.touches[0].clientY;
        });

        document.getElementById('playerArea').addEventListener('touchend', e => {
            const touchEnd = e.changedTouches[0].clientY;
            if (touchStart - touchEnd > 100) {
                // Swipe Up -> Next Video Logic
                window.location.reload(); 
            }
        });

        // 4. Fetch Related Content
        async function fetchRelated() {
            const relatedList = document.getElementById('relatedList');
            const q = query(collection(db, "videos"), limit(10));
            const snap = await getDocs(q);

            snap.forEach(doc => {
                if (doc.id === videoId) return;
                const d = doc.data();
                const card = document.createElement('div');
                card.className = 'related-card';
                card.onclick = () => window.location.href = `video-play.html?id=${doc.id}`;
                card.innerHTML = `
                    <div class="thumb-mini"><img src="${d.thumbnail || ''}"></div>
                    <div class="related-info">
                        <h4>${d.title}</h4>
                        <p>${d.username} • ${d.views || 0} views</p>
                    </div>
                `;
                relatedList.appendChild(card);
            });
        }

        // Like Toggle
        document.getElementById('likeBtn').onclick = function() {
            this.classList.toggle('liked');
            // Update Firestore logic here
        };

        // Inject Loader
        fetch('./imp/loader.html').then(r => r.text()).then(h => {
            document.getElementById('loaderContainer').innerHTML = h;
            eval(document.getElementById('loaderContainer').getElementsByTagName('script')[0].innerText);
        });
    </script>
</body>
</html>
