<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexy Hub - Luxury Cinema</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --accent: #6366f1;
            --bg: #ffffff;
            --card: #f8fafc;
            --border: #e2e8f0;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #0f172a;
        }

        /* --- STICKY NAV --- */
        .player-nav {
            position: sticky; top: 0; width: 100%; height: 60px;
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px);
            display: flex; align-items: center; padding: 0 15px;
            z-index: 1000; border-bottom: 1px solid var(--border);
        }

        .back-btn {
            background: none; border: none; cursor: pointer;
            margin-right: 15px; display: flex; align-items: center;
        }

        /* --- THEATER PLAYER --- */
        .theater-wrapper {
            width: 100%; background: #000; position: relative;
            aspect-ratio: 16/9; display: flex; justify-content: center;
        }

        video { width: 100%; height: 100%; max-height: 80vh; }

        /* --- VIDEO INFO SECTION --- */
        .info-container { padding: 20px; max-width: 1200px; margin: 0 auto; }

        .video-title { font-size: 20px; font-weight: 800; line-height: 1.4; margin-bottom: 10px; }

        .stats-row { font-size: 13px; color: #64748b; font-weight: 600; margin-bottom: 20px; }

        /* --- INTERACTION BAR --- */
        .action-bar {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px;
            scrollbar-width: none; border-bottom: 1px solid var(--border); margin-bottom: 20px;
        }
        .action-bar::-webkit-scrollbar { display: none; }

        .action-pill {
            padding: 10px 20px; border-radius: 30px; background: var(--card);
            border: 1.5px solid var(--border); font-size: 13px; font-weight: 700;
            display: flex; align-items: center; gap: 8px; cursor: pointer; transition: var(--transition);
            white-space: nowrap;
        }
        .action-pill:active { transform: scale(0.95); background: #e2e8f0; }
        .action-pill svg { width: 18px; height: 18px; }

        /* --- CREATOR SECTION --- */
        .creator-card {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card); padding: 15px; border-radius: 20px; margin-bottom: 25px;
        }

        .creator-info { display: flex; align-items: center; gap: 12px; }
        .creator-avatar { width: 45px; height: 45px; border-radius: 50%; background: #000; color: white; display: flex; justify-content: center; align-items: center; font-weight: 800; }
        
        .creator-name h4 { font-size: 15px; font-weight: 800; }
        .creator-name p { font-size: 12px; color: #64748b; font-weight: 600; }

        .follow-btn {
            background: var(--primary); color: white; padding: 10px 20px;
            border-radius: 12px; font-size: 13px; font-weight: 700; border: none; cursor: pointer;
        }

        /* --- DESCRIPTION --- */
        .desc-box { background: var(--card); padding: 15px; border-radius: 15px; font-size: 14px; line-height: 1.6; color: #475569; margin-bottom: 25px; }

        /* --- AD PLACEMENT --- */
        .ad-banner {
            width: 100%; padding: 20px; border-radius: 20px; background: #1e293b;
            color: white; text-align: center; margin-bottom: 30px;
        }

        /* --- RELATED CONTENT GRID --- */
        .related-title { font-size: 18px; font-weight: 800; margin-bottom: 15px; }
        
        .related-list { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 768px) { .related-list { grid-template-columns: 1fr 1fr; } }

        .related-card { display: flex; gap: 12px; cursor: pointer; }
        .rel-thumb { width: 140px; aspect-ratio: 16/9; background: #e2e8f0; border-radius: 12px; overflow: hidden; flex-shrink: 0; }
        .rel-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .rel-info h5 { font-size: 14px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
        .rel-info p { font-size: 11px; color: #64748b; font-weight: 600; }

    </style>
</head>
<body>

    <div id="loaderContainer"></div>

    <nav class="player-nav">
        <button class="back-btn" onclick="history.back()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <span style="font-weight: 800;">Nexy Hub Cinema</span>
    </nav>

    <div class="theater-wrapper">
        <video id="mainVideo" controls autoplay playsinline></video>
    </div>

    <main class="info-container">
        <h1 class="video-title" id="vTitle">Loading Elite Content...</h1>
        <div class="stats-row" id="vStats">0 views • Jun 23, 2024</div>

        <!-- Action Bar -->
        <div class="action-bar">
            <div class="action-pill" onclick="handleLike()">
                <svg viewBox="0 0 24 24" id="likeIcon"><path d="M12 21.35L10.55 20.03C5.4 15.36 2 12.28 2 8.5C2 5.42 4.42 3 7.5 3C9.24 3 10.91 3.81 12 5.09C13.09 3.81 14.76 3 16.5 3C19.58 3 22 5.42 22 8.5C22 12.28 18.6 15.36 13.46 20.04L12 21.35Z"/></svg>
                <span id="likeCount">Elite Like</span>
            </div>
            <div class="action-pill" onclick="handleShare()">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
                <span>Elite Share</span>
            </div>
            <div class="action-pill">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                <span>Save</span>
            </div>
        </div>

        <!-- Creator -->
        <div class="creator-card">
            <div class="creator-info">
                <div class="creator-avatar" id="cAvatar">U</div>
                <div class="creator-name">
                    <h4 id="cName">Elite Creator</h4>
                    <p>Verified Elite Member</p>
                </div>
            </div>
            <button class="follow-btn">Elite Follow</button>
        </div>

        <!-- Description -->
        <div class="desc-box" id="vDesc">
            Premium luxury description loading... Experience Nexy Hub.
        </div>

        <!-- Ad -->
        <div class="ad-banner">
            <h3 style="font-weight: 800; font-size: 16px;">Nexy Premium Access</h3>
            <p style="font-size: 12px; opacity: 0.8; margin-top: 5px;">Ad-free cinema & offline elite viewing.</p>
        </div>

        <!-- Related Feed -->
        <h3 class="related-title">Next Elite Content</h3>
        <div class="related-list" id="relatedList">
            <!-- Related items injected here -->
        </div>

    </main>

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, collection, query, limit, getDocs, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db } from "./imp/firebase-config.js";

        // 1. Get Video ID from URL
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');

        if (!videoId) window.location.replace('home.html');

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.replace('login.html');
            else {
                loadVideoData();
                loadRelatedVideos();
            }
        });

        // 2. Fetch Specific Video
        async function loadVideoData() {
            try {
                const snap = await getDoc(doc(db, "videos", videoId));
                if (snap.exists()) {
                    const data = snap.data();
                    
                    // UI Update
                    document.getElementById('mainVideo').src = data.videoURL;
                    document.getElementById('vTitle').innerText = data.title;
                    document.getElementById('vDesc').innerText = data.title + " - Luxury content exclusively on Nexy Hub.";
                    document.getElementById('vStats').innerText = `${data.views || 0} elite views • Jun 2024`;
                    document.getElementById('cName').innerText = data.username || "Elite Member";
                    document.getElementById('cAvatar').innerText = (data.username || "U").charAt(0).toUpperCase();
                    document.getElementById('likeCount').innerText = `${data.likes || 0} Elite Likes`;

                    // Increment View Count
                    updateDoc(doc(db, "videos", videoId), { views: increment(1) });
                }
            } catch (e) { console.error(e); }
        }

        // 3. Fetch Related Feed
        async function loadRelatedVideos() {
            const list = document.getElementById('relatedList');
            try {
                const q = query(collection(db, "videos"), limit(10));
                const snap = await getDocs(q);
                
                snap.forEach(doc => {
                    if (doc.id === videoId) return; // Skip current
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = 'related-card';
                    card.onclick = () => window.location.href = `video-player.html?v=${doc.id}`;
                    
                    card.innerHTML = `
                        <div class="rel-thumb"><img src="${data.thumbnail || ''}"></div>
                        <div class="rel-info">
                            <h5>${data.title}</h5>
                            <p>${data.username || 'Elite Creator'}</p>
                            <p>${data.views || 0} views</p>
                        </div>
                    `;
                    list.appendChild(card);
                });
            } catch (e) { console.error(e); }
        }

        window.handleLike = async () => {
            document.getElementById('likeIcon').style.fill = "#6366f1";
            // In production: updateDoc(doc(db, "videos", videoId), { likes: increment(1) });
        };

        window.handleShare = () => {
            if (navigator.share) {
                navigator.share({ title: 'Nexy Hub Elite', url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Elite link copied!");
            }
        };

        // Inject Loader
        fetch('./imp/loader.html').then(r => r.text()).then(html => {
            document.getElementById('loaderContainer').innerHTML = html;
            const scripts = document.getElementById('loaderContainer').getElementsByTagName('script');
            for (let s of scripts) eval(s.innerText);
        });

    </script>
</body>
</html>
