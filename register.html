<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Register - Nexy Fans</title>
    <meta name="theme-color" content="#ffffff">
    
    <!-- Google Fonts for Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fdfdfd;
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation */
        .top-nav {
            display: flex;
            align-items: center;
            margin-bottom: 32px;
            padding-top: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .back-btn:active {
            background: #f1f5f9;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            fill: #1a1a1a;
        }

        /* Header */
        .header {
            margin-bottom: 32px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: #64748b;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            background: #ffffff;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: #1a1a1a;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #1a1a1a;
            box-shadow: 0 0 0 4px rgba(26, 26, 26, 0.05);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            border: none;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: #1a1a1a;
            color: #ffffff;
            margin-top: 8px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .btn-google {
            background: #ffffff;
            color: #1a1a1a;
            border: 1.5px solid #e2e8f0;
            margin-top: 16px;
        }

        .btn-google svg {
            width: 20px;
            height: 20px;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider:not(:empty)::before {
            margin-right: 16px;
        }

        .divider:not(:empty)::after {
            margin-left: 16px;
        }

        /* Footer Links */
        .footer-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #64748b;
        }

        .footer-link a {
            color: #1a1a1a;
            font-weight: 600;
            text-decoration: none;
        }

        /* Error Message */
        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            display: none;
            background: #fef2f2;
            padding: 10px;
            border-radius: 8px;
        }

        /* Loader inside button */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Back Button -->
        <div class="top-nav">
            <button class="back-btn" onclick="window.location.href='welcome.html'">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 11H7.83L13.42 5.41L12 4L4 12L12 20L13.41 18.59L7.83 13H20V11Z"/>
                </svg>
            </button>
        </div>

        <!-- Header -->
        <div class="header">
            <h1 class="title">Create Account</h1>
            <p class="subtitle">Join the premium community today.</p>
        </div>

        <div id="errorMessage" class="error-msg"></div>

        <!-- Registration Form -->
        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="+1 234 567 8900" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender" required>
                        <option value="" disabled selected>Select</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dob" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Min. 8 characters" minlength="8" required>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
                <span id="btnText">Sign Up</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>
        </form>

        <div class="divider">OR</div>

        <!-- Google Auth Button -->
        <button class="btn btn-google" id="googleBtn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </button>

        <div class="footer-link">
            Already have an account? <a href="login.html">Log In</a>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { createUserWithEmailAndPassword, signInWithPopup, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db, googleProvider } from "./imp/firebase-config.js";

        // UI Elements
        const registerForm = document.getElementById('registerForm');
        const googleBtn = document.getElementById('googleBtn');
        const errorMsg = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        // Show Error Helper
        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
            setLoading(false);
        }

        // Loading State Helper
        function setLoading(isLoading) {
            if(isLoading) {
                btnText.style.display = 'none';
                btnSpinner.style.display = 'block';
                submitBtn.disabled = true;
            } else {
                btnText.style.display = 'block';
                btnSpinner.style.display = 'none';
                submitBtn.disabled = false;
            }
        }

        // Handle Email/Password Registration
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            setLoading(true);

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const gender = document.getElementById('gender').value;
            const dob = document.getElementById('dob').value;
            const password = document.getElementById('password').value;

            try {
                // 1. Create Auth User
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Update Auth Profile
                await updateProfile(user, { displayName: fullName });

                // 3. Save User Data to Firestore
                await setDoc(doc(db, "users", user.uid), {
                    id: user.uid,
                    email: user.email,
                    username: fullName,
                    phone: phone,
                    gender: gender,
                    dob: dob,
                    role: "user",
                    status: "active",
                    lastUploadDate: null,
                    createdAt: serverTimestamp()
                });

                // Redirect to Home
                window.location.replace("home.html");

            } catch (error) {
                let niceError = "An error occurred during registration.";
                if (error.code === 'auth/email-already-in-use') niceError = "This email is already registered.";
                if (error.code === 'auth/weak-password') niceError = "Password should be at least 6 characters.";
                showError(niceError);
            }
        });

        // Handle Google Auth
        googleBtn.addEventListener('click', async () => {
            errorMsg.style.display = 'none';
            
            try {
                // 1. Trigger Google Popup
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;

                // 2. Check if user already exists in Firestore
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    // New Google User - Create Document
                    // Note: Google doesn't provide phone, gender, or DOB by default, so we set them to empty/null.
                    await setDoc(userRef, {
                        id: user.uid,
                        email: user.email,
                        username: user.displayName || "Google User",
                        phone: user.phoneNumber || "",
                        gender: "",
                        dob: "",
                        role: "user",
                        status: "active",
                        lastUploadDate: null,
                        createdAt: serverTimestamp()
                    });
                }

                // Redirect to Home
                window.location.replace("home.html");

            } catch (error) {
                if (error.code !== 'auth/popup-closed-by-user') {
                    showError("Google sign-in failed. Please try again.");
                }
            }
        });
    </script>
</body>
</html>
