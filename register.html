<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Create Elite Account - Nexy Hub</title>
    
    <!-- Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --accent: #6366f1;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --error: #ef4444;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Luxury Background Mesh */
        .luxury-mesh {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 0% 0%, #e2e8f0 0%, transparent 40%),
                        radial-gradient(circle at 100% 100%, #f1f5f9 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 40px 24px;
            animation: fadeIn 0.8s ease-out;
        }

        /* Header */
        .header { margin-bottom: 32px; text-align: center; }
        .logo-mini {
            width: 50px; height: 50px; background: var(--primary);
            border-radius: 15px; display: flex; justify-content: center;
            align-items: center; margin: 0 auto 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .title { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; }
        .subtitle { font-size: 15px; color: #64748b; font-weight: 500; }

        /* Form Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid white;
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05);
        }

        .form-group { margin-bottom: 18px; opacity: 0; transform: translateY(10px); animation: slideUp 0.5s forwards; }
        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }

        label { display: block; font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; margin-left: 4px; }

        input, select {
            width: 100%; padding: 16px; border-radius: 16px; border: 1.5px solid #e2e8f0;
            background: white; font-size: 15px; font-weight: 500; outline: none; transition: var(--transition);
        }

        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0,0,0,0.03); }

        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }

        /* Premium Buttons */
        .btn {
            width: 100%; padding: 18px; border-radius: 18px; font-size: 16px; font-weight: 700;
            cursor: pointer; border: none; transition: var(--transition);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }

        .btn-primary { background: var(--primary); color: white; margin-top: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .btn-primary:active { transform: scale(0.97); }

        .btn-google { background: white; border: 1.5px solid #e2e8f0; color: var(--text); margin-top: 20px; }
        .btn-google:active { background: #f8fafc; }

        .divider { display: flex; align-items: center; margin: 24px 0; color: #cbd5e1; font-size: 12px; font-weight: 700; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; }
        .divider span { padding: 0 15px; }

        /* Age Warning Popup (Luxury Modal) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(10px);
            z-index: 1000; display: none; justify-content: center; align-items: center;
            padding: 24px;
        }

        .modal {
            background: white; padding: 30px; border-radius: 30px; width: 100%; max-width: 350px;
            text-align: center; animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-icon { width: 60px; height: 60px; background: #fef2f2; border-radius: 20px; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; }
        .modal-icon svg { fill: var(--error); width: 30px; height: 30px; }
        .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
        .modal-text { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 24px; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .loading-spinner {
            width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white; border-radius: 50%; animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="luxury-mesh"></div>

    <div class="container">
        <div class="header">
            <div class="logo-mini">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M8 5.14V18.86C8 19.75 8.97 20.29 9.72 19.82L20.59 13.06C21.28 12.63 21.28 11.64 20.59 11.21L9.72 4.45C8.97 3.98 8 4.52 8 5.14Z"/></svg>
            </div>
            <h1 class="title">Elite Registration</h1>
            <p class="subtitle">Enter your details to join the hub.</p>
        </div>

        <div class="glass-card">
            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Name" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="name@luxury.com" required>
                </div>

                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="phone" placeholder="+1 234 567 890" required>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Gender</label>
                        <select id="gender" required>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                              <option value="Gay">Gay</option>
                              <option value="Lasbion"Lasbion</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" id="dob" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="pass" placeholder="*********" required minlength="8">
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span>Create Account</span>
                    <div class="loading-spinner" id="spinner"></div>
                </button>
            </form>

            <div class="divider"><span>OR JOIN WITH</span></div>

            <button class="btn btn-google" id="googleBtn">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Google
            </button>
        </div>

        <p style="text-align: center; margin-top: 30px; font-size: 14px; color: #64748b; font-weight: 500;">
            Already an elite? <a href="login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Sign In</a>
        </p>
    </div>

    <!-- Error Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            </div>
            <h2 class="modal-title">Access Denied</h2>
            <p class="modal-text" id="modalMsg">You must be at least 18 years old to join Nexy Hub.</p>
            <button class="btn btn-primary" onclick="closeModal()">I Understand</button>
        </div>
    </div>

    <script type="module">
        import { createUserWithEmailAndPassword, signInWithPopup, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db, googleProvider } from "./imp/firebase-config.js";

        const form = document.getElementById('registerForm');
        const overlay = document.getElementById('modalOverlay');
        const modalMsg = document.getElementById('modalMsg');

        function calculateAge(dob) {
            const diff = Date.now() - new Date(dob).getTime();
            return Math.abs(new Date(diff).getUTCFullYear() - 1970);
        }

        window.closeModal = () => overlay.style.display = 'none';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const dob = document.getElementById('dob').value;
            if (calculateAge(dob) < 18) {
                overlay.style.display = 'flex';
                return;
            }

            // Start Loading
            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('spinner');
            btn.children[0].style.display = 'none';
            spinner.style.display = 'block';

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const gender = document.getElementById('gender').value;
            const pass = document.getElementById('pass').value;

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(cred.user, { displayName: name });

                await setDoc(doc(db, "users", cred.user.uid), {
                    uid: cred.user.uid,
                    name,
                    email,
                    phone,
                    gender,
                    dob,
                    role: 'user',
                    status: 'active',
                    lastUploadDate: null,
                    createdAt: serverTimestamp()
                });

                window.location.replace('home.html');
            } catch (err) {
                alert(err.message);
                btn.children[0].style.display = 'block';
                spinner.style.display = 'none';
            }
        });

        // Google Handler (Syncs Mandatory Data)
        document.getElementById('googleBtn').onclick = async () => {
            try {
                const res = await signInWithPopup(auth, googleProvider);
                const userRef = doc(db, "users", res.user.uid);
                const snap = await getDoc(userRef);

                if (!snap.exists()) {
                    // Force complete profile if it's a new user via Google
                    // In a production app, you'd show a specialized modal here.
                    // For now, we save what we have and let the user update phone/dob in settings.
                    await setDoc(userRef, {
                        uid: res.user.uid,
                        name: res.user.displayName,
                        email: res.user.email,
                        phone: "",
                        gender: "",
                        dob: "",
                        role: 'user',
                        status: 'active',
                        createdAt: serverTimestamp()
                    });
                }
                window.location.replace('home.html');
            } catch (err) {
                console.error(err);
            }
        };
    </script>
</body>
</html>
