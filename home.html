<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexy Hub - Luxury Feed</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --accent: #6366f1;
            --bg: #f8fafc;
            --card: #ffffff;
            --glass: rgba(255, 255, 255, 0.8);
            --border: #f1f5f9;
            --shadow: 0 20px 40px rgba(0,0,0,0.04);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #0f172a;
            overflow-x: hidden;
        }

        /* --- LUXURY HEADER --- */
        .top-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: var(--glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1000; border-bottom: 1px solid var(--border);
        }

        .search-box { flex: 1; max-width: 450px; position: relative; margin: 0 20px; }
        .search-box input {
            width: 100%; padding: 12px 20px 12px 45px; border-radius: 16px;
            border: 1.5px solid var(--border); background: #f1f5f9;
            font-size: 14px; font-weight: 600; outline: none; transition: var(--transition);
        }
        .search-box input:focus { border-color: var(--primary); background: white; width: 110%; }
        .search-box svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); fill: #94a3b8; width: 18px; }

        /* --- CATEGORY CHIPS --- */
        .category-bar {
            display: flex; gap: 12px; padding: 15px 20px; overflow-x: auto;
            background: white; border-bottom: 1px solid var(--border);
            margin-top: 70px; scrollbar-width: none; position: sticky; top: 70px; z-index: 999;
        }
        .category-bar::-webkit-scrollbar { display: none; }

        .chip {
            padding: 10px 22px; border-radius: 14px; background: #f1f5f9;
            font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer;
            transition: var(--transition); border: 1.5px solid transparent;
        }
        .chip.active { background: var(--primary); color: white; transform: scale(1.05); }

        /* --- MAIN LAYOUT --- */
        .main-content {
            padding: 25px; padding-bottom: 120px;
            max-width: 1300px; margin: 0 auto;
        }

        @media (min-width: 768px) { body { padding-left: 80px; } }

        /* --- LUXURY GRID --- */
        .feed-grid { display: grid; grid-template-columns: 1fr; gap: 30px; }
        @media (min-width: 768px) { .feed-grid { grid-template-columns: 1fr 1fr; } }
        @media (min-width: 1200px) { .feed-grid { grid-template-columns: 1fr 1fr 1fr; } }

        /* --- VIDEO CARD --- */
        .card {
            background: var(--card); border-radius: 32px; overflow: hidden;
            box-shadow: var(--shadow); border: 1px solid white; transition: var(--transition);
            cursor: pointer; position: relative;
        }

        .card:hover { transform: translateY(-8px); box-shadow: 0 40px 80px rgba(0,0,0,0.1); }

        .video-container {
            width: 100%; aspect-ratio: 16/9; background: #000;
            position: relative; overflow: hidden;
        }

        .video-container video { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }

        .gender-badge {
            position: absolute; top: 15px; left: 15px; padding: 6px 14px;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
            border-radius: 12px; font-size: 11px; font-weight: 800; display: flex; align-items: center; gap: 6px;
            color: var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .duration {
            position: absolute; bottom: 12px; right: 12px; padding: 4px 10px;
            background: rgba(0,0,0,0.7); color: white; border-radius: 8px; font-size: 11px; font-weight: 700;
        }

        .card-info { padding: 22px; display: flex; gap: 18px; }

        .uploader-avatar {
            width: 48px; height: 48px; border-radius: 18px; background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            display: flex; justify-content: center; align-items: center; font-weight: 800; color: #475569;
            flex-shrink: 0; font-size: 18px;
        }

        .text-wrap h3 { font-size: 17px; font-weight: 800; line-height: 1.3; margin-bottom: 6px; color: #1e293b; }
        .text-wrap p { font-size: 13px; color: #64748b; font-weight: 600; display: flex; align-items: center; gap: 5px; }

        /* --- AD SYSTEM --- */
        .luxury-ad {
            grid-column: 1 / -1; background: linear-gradient(135deg, #000000 0%, #1e293b 100%);
            border-radius: 35px; padding: 40px; color: white; position: relative;
            overflow: hidden; text-align: center; margin: 15px 0; border: 1px solid rgba(255,255,255,0.1);
        }
        .ad-label { position: absolute; top: 15px; right: 20px; font-size: 10px; opacity: 0.6; font-weight: 900; letter-spacing: 1px; }
        .ad-btn {
            display: inline-block; margin-top: 20px; padding: 12px 30px;
            background: white; color: var(--primary); border-radius: 15px;
            text-decoration: none; font-weight: 800; font-size: 14px; transition: var(--transition);
        }
        .ad-btn:hover { transform: scale(1.05); }

        .load-more {
            width: 100%; padding: 22px; margin-top: 40px; border-radius: 25px;
            background: white; border: 2px solid var(--border); font-size: 16px;
            font-weight: 800; cursor: pointer; transition: var(--transition); color: #64748b;
        }
        .load-more:hover { border-color: var(--primary); color: var(--primary); }

        .skeleton { height: 280px; background: #f1f5f9; border-radius: 32px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    </style>
</head>
<body>

    <div id="navDockContainer"></div>
    <div id="loaderContainer"></div>

    <header class="top-header">
        <div style="font-weight: 900; font-size: 24px; letter-spacing: -1.5px; cursor: pointer;" onclick="location.reload()">Nexy<span style="color:var(--accent)">.</span></div>
        
        <div class="search-box">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="Search elite experiences...">
        </div>

        <div style="width: 45px; height: 45px; background: #e2e8f0; border-radius: 15px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-weight: 800;" onclick="window.location.href='profile.html'">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
    </header>

    <div class="category-bar" id="categoryBar">
        <div class="chip active" data-cat="all">All Elite</div>
        <div class="chip" data-cat="trending">Trending</div>
        <div class="chip" data-cat="luxury">Luxury Life</div>
        <div class="chip" data-cat="action">Action</div>
        <div class="chip" data-cat="gaming">Gaming</div>
        <div class="chip" data-cat="music">Music</div>
    </div>

    <main class="main-content">
        <div class="luxury-ad">
            <span class="ad-label">SPONSORED ACCESS</span>
            <h2 style="font-size: 26px; font-weight: 900; letter-spacing: -1px;">Upgrade to Elite Plus</h2>
            <p style="font-size: 14px; opacity: 0.8; margin-top: 8px; font-weight: 500;">Zero ads. 4K Cinema. Exclusive communities.</p>
            <a href="#" class="ad-btn">Start Membership</a>
        </div>

        <div class="feed-grid" id="videoGrid">
            <!-- Luxury Loading State -->
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </div>

        <button class="load-more" id="loadMoreBtn">Discover More Elite Content</button>
    </main>

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, query, orderBy, limit, getDocs, startAfter, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db } from "./imp/firebase-config.js";

        let lastVisible = null;
        let isLoading = false;
        let currentCategory = 'all';

        // 1. Auth Guard
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.replace("login.html");
            else fetchVideos();
        });

        // 2. Fetch Logic
        async function fetchVideos(isLoadMore = false, searchQuery = '') {
            if (isLoading) return;
            isLoading = true;
            const grid = document.getElementById('videoGrid');

            try {
                let q = collection(db, "videos");
                
                // Add Filtering
                if (currentCategory !== 'all') {
                    q = query(q, where("category", "==", currentCategory.toLowerCase()));
                }

                q = query(q, orderBy("createdAt", "desc"), limit(12));

                if (isLoadMore && lastVisible) {
                    q = query(q, startAfter(lastVisible), limit(12));
                } else if (!isLoadMore) {
                    grid.innerHTML = ''; 
                }

                const snap = await getDocs(q);
                if (snap.empty) {
                    if (!isLoadMore) grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; font-weight:800; color:#94a3b8;">No elite content found here yet.</div>';
                    document.getElementById('loadMoreBtn').innerText = "All caught up!";
                    return;
                }

                lastVisible = snap.docs[snap.docs.length - 1];

                snap.forEach(doc => {
                    const data = doc.data();
                    // Local search filter
                    if (searchQuery && !data.title.toLowerCase().includes(searchQuery.toLowerCase())) return;
                    grid.appendChild(createVideoCard(data, doc.id));
                });

            } catch (e) {
                console.error("Fetch Error:", e);
            } finally {
                isLoading = false;
            }
        }

        // 3. Luxury UI Component
        function createVideoCard(data, id) {
            const el = document.createElement('div');
            el.className = 'card';
            el.onclick = () => window.location.href = `video-player.html?v=${id}`;
            
            let genderIcon = "🌍";
            if (data.target === 'male') genderIcon = "👨";
            else if (data.target === 'female') genderIcon = "👩";
            else if (data.target === 'kids') genderIcon = "👶";

            el.innerHTML = `
                <div class="video-container">
                    <video src="${data.videoURL}" muted onmouseover="this.play()" onmouseout="this.pause(); this.currentTime=0;"></video>
                    <div class="gender-badge">${genderIcon} <span>${data.target || 'General'}</span></div>
                    <div class="duration">ELITE</div>
                </div>
                <div class="card-info">
                    <div class="uploader-avatar">${(data.username || 'E').charAt(0).toUpperCase()}</div>
                    <div class="text-wrap">
                        <h3>${data.title}</h3>
                        <p>${data.username || 'Elite User'} • ${data.views || 0} views</p>
                    </div>
                </div>
            `;
            return el;
        }

        // 4. Search Implementation
        let searchTimeout;
        document.getElementById('searchInput').oninput = (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                fetchVideos(false, e.target.value);
            }, 500);
        };

        // 5. Category Logic
        document.querySelectorAll('.chip').forEach(chip => {
            chip.onclick = () => {
                document.querySelector('.chip.active').classList.remove('active');
                chip.classList.add('active');
                currentCategory = chip.dataset.cat;
                fetchVideos();
            };
        });

        document.getElementById('loadMoreBtn').onclick = () => fetchVideos(true);

        // Inject Components
        const inject = (url, target) => {
            fetch(url).then(r => r.text()).then(html => {
                document.getElementById(target).innerHTML = html;
                const scripts = document.getElementById(target).getElementsByTagName('script');
                for (let s of scripts) eval(s.innerText);
            });
        };
        inject('./imp/nav-dock-button.html', 'navDockContainer');
        inject('./imp/loader.html', 'loaderContainer');

    </script>
</body>
</html>
