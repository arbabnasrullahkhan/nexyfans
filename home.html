<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexy Hub - Elite Feed</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --accent: #6366f1;
            --bg: #f8fafc;
            --card: #ffffff;
            --glass: rgba(255, 255, 255, 0.85);
            --border: #eef2f6;
            --shadow: 0 15px 35px rgba(0,0,0,0.05);
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #0f172a;
            overflow-x: hidden;
        }

        /* --- LUXURY HEADER --- */
        .top-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 75px;
            background: var(--glass); backdrop-filter: blur(25px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 25px; z-index: 1000; border-bottom: 1.5px solid var(--border);
        }

        .search-container {
            flex: 1; max-width: 450px; position: relative; margin: 0 20px;
        }

        .search-container input {
            width: 100%; padding: 14px 20px 14px 50px; border-radius: 18px;
            border: 1.5px solid var(--border); background: #f1f5f9;
            font-size: 14px; font-weight: 600; outline: none; transition: var(--transition);
        }

        .search-container input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 5px rgba(0,0,0,0.02); }
        .search-container svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); fill: #94a3b8; width: 20px; }

        /* --- CATEGORY BAR --- */
        .category-scroll {
            display: flex; gap: 12px; padding: 15px 25px; overflow-x: auto;
            background: white; border-bottom: 1px solid var(--border);
            margin-top: 75px; scrollbar-width: none; position: sticky; top: 75px; z-index: 900;
        }
        .category-scroll::-webkit-scrollbar { display: none; }

        .chip {
            padding: 10px 22px; border-radius: 15px; background: #f1f5f9;
            font-size: 13px; font-weight: 800; white-space: nowrap; cursor: pointer;
            transition: var(--transition); border: 1.5px solid transparent; color: #64748b;
        }
        .chip.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* --- MAIN FEED --- */
        .main-feed {
            padding: 25px; padding-bottom: 120px;
            max-width: 1300px; margin: 0 auto;
        }

        @media (min-width: 768px) { body { padding-left: 80px; } }

        .feed-grid {
            display: grid; grid-template-columns: 1fr; gap: 30px;
        }

        @media (min-width: 768px) { .feed-grid { grid-template-columns: 1fr 1fr; } }

        /* --- LUXURY CARD --- */
        .video-card {
            background: var(--card); border-radius: 32px; overflow: hidden;
            box-shadow: var(--shadow); border: 1px solid white; transition: var(--transition);
            position: relative; cursor: pointer;
        }

        .video-card:hover { transform: translateY(-8px); box-shadow: 0 30px 60px rgba(0,0,0,0.1); }

        .thumbnail-area {
            width: 100%; aspect-ratio: 16/9; background: #000;
            position: relative; overflow: hidden;
        }

        .thumbnail-area video {
            width: 100%; height: 100%; object-fit: cover;
            pointer-events: none;
        }

        .badge-luxury {
            position: absolute; top: 18px; left: 18px; padding: 7px 15px;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
            border-radius: 12px; font-size: 11px; font-weight: 900; 
            display: flex; align-items: center; gap: 6px; text-transform: uppercase;
        }

        .duration-tag {
            position: absolute; bottom: 15px; right: 18px; padding: 5px 10px;
            background: rgba(0,0,0,0.75); color: white; border-radius: 8px; font-size: 11px; font-weight: 700;
        }

        .card-details { padding: 22px; display: flex; gap: 18px; }

        .creator-pfp {
            width: 50px; height: 50px; border-radius: 18px; background: #e2e8f0;
            display: flex; justify-content: center; align-items: center; font-weight: 800; 
            color: #64748b; flex-shrink: 0; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            text-transform: uppercase; font-size: 18px;
        }

        .meta-text { flex: 1; }
        .meta-text h3 { font-size: 17px; font-weight: 800; line-height: 1.4; margin-bottom: 6px; color: #0f172a; }
        .meta-text p { font-size: 13px; color: #94a3b8; font-weight: 700; display: flex; align-items: center; gap: 5px; }

        /* --- AD UNIT --- */
        .elite-ad {
            grid-column: 1 / -1; background: linear-gradient(135deg, #000000 0%, #1e293b 100%);
            border-radius: 30px; padding: 40px; color: white; text-align: center;
            position: relative; overflow: hidden; margin: 15px 0;
        }
        .ad-mark { position: absolute; top: 15px; right: 20px; font-size: 9px; opacity: 0.4; font-weight: 900; letter-spacing: 1px; }

        /* Skeletons */
        .skeleton-loader { height: 280px; background: #eef2f6; border-radius: 30px; animation: shine 1.5s infinite; }
        @keyframes shine { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        .empty-box { grid-column: 1/-1; text-align: center; padding: 100px 0; color: #94a3b8; font-weight: 700; }
    </style>
</head>
<body>

    <div id="navDockContainer"></div>
    <div id="loaderContainer"></div>

    <header class="top-header">
        <div style="font-weight: 900; font-size: 24px; letter-spacing: -1.2px;">Nexy<span style="color:var(--accent)">.</span></div>
        
        <div class="search-container">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="feedSearch" placeholder="Search elite experiences...">
        </div>

        <div style="width: 45px; height: 45px; background: #eef2f6; border-radius: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 800;" onclick="window.location.href='profile.html'">U</div>
    </header>

    <div class="category-scroll">
        <div class="chip active" data-cat="all">All Elite</div>
        <div class="chip" data-cat="luxury">Luxury</div>
        <div class="chip" data-cat="action">Action</div>
        <div class="chip" data-cat="gaming">Gaming</div>
        <div class="chip" data-cat="trends">Trending</div>
    </div>

    <main class="main-feed">
        <div class="feed-grid" id="mainGrid">
            <!-- Skeletons -->
            <div class="skeleton-loader"></div>
            <div class="skeleton-loader"></div>
        </div>
    </main>

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, query, orderBy, limit, getDocs, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db } from "./imp/firebase-config.js";

        let currentCategory = "all";

        // 1. Auth & Load
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.replace("login.html");
            else fetchEliteFeed();
        });

        // 2. Time Formatter (Luxury Style)
        function formatEliteTime(timestamp) {
            if (!timestamp) return "Just now";
            const seconds = Math.floor((new Date() - timestamp.toDate()) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + "y ago";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + "mo ago";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + "d ago";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + "h ago";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + "m ago";
            return "Just now";
        }

        // 3. Fetch Feed
        async function fetchEliteFeed(filter = "") {
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = '<div class="skeleton-loader"></div><div class="skeleton-loader"></div>';

            try {
                let q = query(collection(db, "videos"), orderBy("createdAt", "desc"), limit(20));

                if (currentCategory !== "all") {
                    q = query(collection(db, "videos"), where("category", "==", currentCategory), orderBy("createdAt", "desc"), limit(20));
                }

                const snap = await getDocs(q);
                grid.innerHTML = '';

                if (snap.empty) {
                    grid.innerHTML = '<div class="empty-box">No elite content found in this category.</div>';
                    return;
                }

                snap.forEach(doc => {
                    const data = doc.data();
                    // Search Logic (Client Side for speed)
                    if (filter && !data.title.toLowerCase().includes(filter.toLowerCase())) return;

                    grid.appendChild(createEliteCard(data, doc.id));
                });

            } catch (e) { console.error("Feed Error:", e); }
        }

        // 4. UI Card Creation
        function createEliteCard(data, id) {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.onclick = () => window.location.href = `video-player.html?v=${id}`;

            const timeAgo = formatEliteTime(data.createdAt);
            const genderEmoji = data.target === 'female' ? "👩" : (data.target === 'kids' ? "👶" : "👨");

            card.innerHTML = `
                <div class="thumbnail-area">
                    <!-- Auto-Thumbnail Hack using #t=0.5 -->
                    <video src="${data.videoURL}#t=0.5" preload="metadata" muted></video>
                    <div class="badge-luxury">${genderEmoji} ${data.target || 'General'}</div>
                    <div class="duration-tag">Premium</div>
                </div>
                <div class="card-details">
                    <div class="creator-pfp">${(data.username || "U").charAt(0)}</div>
                    <div class="meta-text">
                        <h3>${data.title || "Untitled Elite Clip"}</h3>
                        <p>${data.username || "Elite Member"} • ${data.views || 0} views • ${timeAgo}</p>
                    </div>
                </div>
            `;
            return card;
        }

        // 5. Search Functionality
        document.getElementById('feedSearch').addEventListener('input', (e) => {
            fetchEliteFeed(e.target.value);
        });

        // 6. Category Chip Logic
        document.querySelectorAll('.chip').forEach(chip => {
            chip.onclick = () => {
                document.querySelector('.chip.active').classList.remove('active');
                chip.classList.add('active');
                currentCategory = chip.getAttribute('data-cat');
                fetchEliteFeed();
            };
        });

        // Inject Components
        const inject = (url, target) => {
            fetch(url).then(r => r.text()).then(html => {
                document.getElementById(target).innerHTML = html;
                const scripts = document.getElementById(target).getElementsByTagName('script');
                for (let s of scripts) eval(s.innerText);
            });
        };
        inject('./imp/nav-dock-button.html', 'navDockContainer');
        inject('./imp/loader.html', 'loaderContainer');

    </script>
</body>
</html>
