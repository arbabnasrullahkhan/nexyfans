<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexy Hub - Luxury Feed</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --accent: #6366f1;
            --bg: #f8fafc;
            --card: #ffffff;
            --glass: rgba(255, 255, 255, 0.85);
            --border: #f1f5f9;
            --shadow: 0 20px 40px rgba(0,0,0,0.04);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #0f172a;
            overflow-x: hidden;
        }

        /* --- LUXURY HEADER --- */
        .top-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: var(--glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1000; border-bottom: 1px solid var(--border);
        }

        .logo-box { font-weight: 900; font-size: 22px; letter-spacing: -1.2px; cursor: pointer; }

        .search-box {
            flex: 1; max-width: 500px; position: relative; margin: 0 20px;
        }

        .search-box input {
            width: 100%; padding: 12px 20px 12px 45px; border-radius: 16px;
            border: 1.5px solid var(--border); background: #f1f5f9;
            font-size: 14px; font-weight: 600; outline: none; transition: var(--transition);
        }

        .search-box input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(0,0,0,0.02); }

        .search-box svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); fill: #94a3b8; width: 18px; }

        /* --- CATEGORY CHIPS --- */
        .category-bar {
            display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto;
            background: white; border-bottom: 1px solid var(--border);
            margin-top: 70px; scrollbar-width: none; position: sticky; top: 70px; z-index: 999;
        }
        .category-bar::-webkit-scrollbar { display: none; }

        .chip {
            padding: 10px 22px; border-radius: 14px; background: #f1f5f9;
            font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer;
            transition: var(--transition); border: 1.5px solid transparent;
        }
        .chip.active { background: var(--primary); color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        /* --- MAIN LAYOUT --- */
        .main-content {
            padding: 20px; padding-bottom: 120px;
            max-width: 1300px; margin: 0 auto;
        }

        @media (min-width: 768px) { body { padding-left: 80px; } }

        /* --- FEED GRID --- */
        .feed-grid {
            display: grid; grid-template-columns: 1fr; gap: 30px;
        }

        @media (min-width: 768px) { .feed-grid { grid-template-columns: 1fr 1fr; } }
        @media (min-width: 1100px) { .feed-grid { grid-template-columns: 1fr 1fr 1fr; } }

        /* --- LUXURY CARD --- */
        .card {
            background: var(--card); border-radius: 32px; overflow: hidden;
            box-shadow: var(--shadow); border: 1px solid white; transition: var(--transition);
            cursor: pointer; position: relative;
        }

        .card:hover { transform: translateY(-8px); box-shadow: 0 30px 60px rgba(0,0,0,0.08); }

        .thumb-wrap {
            width: 100%; aspect-ratio: 16/9; background: #000;
            position: relative; overflow: hidden;
        }

        /* Auto Thumbnail Logic: Video Frame 0.5s */
        .thumb-wrap video { 
            width: 100%; height: 100%; object-fit: cover; 
            pointer-events: none; opacity: 0.9;
        }

        .play-hint {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 50px; height: 50px; background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px); border-radius: 50%; 
            display: flex; justify-content: center; align-items: center;
            opacity: 0; transition: var(--transition);
        }
        .card:hover .play-hint { opacity: 1; }

        .gender-tag {
            position: absolute; top: 15px; left: 15px; padding: 6px 12px;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
            border-radius: 12px; font-size: 11px; font-weight: 800; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .time-tag {
            position: absolute; bottom: 12px; right: 12px; padding: 5px 10px;
            background: rgba(0,0,0,0.6); color: white; border-radius: 8px; font-size: 11px; font-weight: 700;
        }

        .card-body { padding: 20px; display: flex; gap: 15px; }

        .avatar {
            width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            display: flex; justify-content: center; align-items: center; font-weight: 800; color: #64748b;
            flex-shrink: 0; border: 2px solid white;
        }

        .meta h3 { font-size: 16px; font-weight: 800; line-height: 1.4; margin-bottom: 6px; 
                   display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .meta p { font-size: 13px; color: #64748b; font-weight: 600; display: flex; align-items: center; gap: 5px; }

        /* --- LOADING & SKELETON --- */
        .skeleton { background: #e2e8f0; border-radius: 25px; height: 280px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        .load-more-area { text-align: center; margin-top: 50px; }
        .btn-luxury {
            padding: 18px 40px; border-radius: 20px; background: white; border: 2.5px solid var(--border);
            font-size: 15px; font-weight: 800; cursor: pointer; transition: var(--transition);
        }
        .btn-luxury:hover { background: var(--primary); color: white; border-color: var(--primary); }

    </style>
</head>
<body>

    <div id="navDockContainer"></div>
    <div id="loaderContainer"></div>

    <header class="top-header">
        <div class="logo-box" onclick="location.reload()">NEXY HUB</div>
        
        <div class="search-box">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="Search elite experiences...">
        </div>

        <div style="width: 44px; height: 44px; background: #e2e8f0; border-radius: 50%; cursor: pointer; border: 2px solid white; box-shadow: var(--shadow);" onclick="window.location.href='profile.html'"></div>
    </header>

    <div class="category-bar" id="categoryBar">
        <div class="chip active" data-cat="all">All Elite</div>
        <div class="chip" data-cat="luxury">Luxury</div>
        <div class="chip" data-cat="action">Action</div>
        <div class="chip" data-cat="gaming">Gaming</div>
        <div class="chip" data-cat="trends">Trending</div>
    </div>

    <main class="main-content">
        <div class="feed-grid" id="videoGrid">
            <!-- Skeletons -->
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </div>

        <div class="load-more-area">
            <button class="btn-luxury" id="loadMoreBtn">Discover More Content</button>
        </div>
    </main>

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, query, orderBy, limit, getDocs, startAfter, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db } from "./imp/firebase-config.js";

        let lastVisible = null;
        let currentCategory = "all";
        let searchQuery = "";

        // 1. Auth Guard
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.replace("login.html");
            else fetchVideos();
        });

        // 2. Fetching Logic (Optimized)
        async function fetchVideos(isLoadMore = false) {
            const grid = document.getElementById('videoGrid');
            if (!isLoadMore) grid.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';

            try {
                let q;
                const baseRef = collection(db, "videos");
                
                // Query Building
                if (currentCategory === "all") {
                    q = query(baseRef, orderBy("createdAt", "desc"), limit(9));
                } else {
                    q = query(baseRef, where("category", "==", currentCategory), orderBy("createdAt", "desc"), limit(9));
                }

                if (isLoadMore && lastVisible) {
                    q = query(q, startAfter(lastVisible));
                }

                const snap = await getDocs(q);
                if (!isLoadMore) grid.innerHTML = '';

                if (snap.empty) {
                    if(!isLoadMore) grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; padding: 50px; font-weight: 700; color: #94a3b8;">No elite content found in this category.</p>';
                    document.getElementById('loadMoreBtn').style.display = 'none';
                    return;
                }

                lastVisible = snap.docs[snap.docs.length - 1];
                document.getElementById('loadMoreBtn').style.display = 'inline-block';

                snap.forEach(doc => {
                    const data = doc.data();
                    grid.appendChild(createVideoCard(data, doc.id));
                });

            } catch (e) {
                console.error("Firestore Error:", e);
            }
        }

        // 3. UI Card Component
        function createVideoCard(data, id) {
            const el = document.createElement('div');
            el.className = 'card';
            el.onclick = () => window.location.href = `video-player.html?v=${id}`;
            
            // Time logic
            const timeAgo = data.createdAt ? formatTime(data.createdAt.toDate()) : "Just now";
            
            // Target icons
            let targetIcon = "🌍";
            if (data.target === 'male') targetIcon = "👨";
            if (data.target === 'female') targetIcon = "👩";
            if (data.target === 'kids') targetIcon = "👶";

            // Thumbnail Logic: Using video source with time seek
            const videoThumb = data.videoURL.includes('youtube.com') || data.videoURL.includes('nexyfans') 
                               ? data.videoURL : `${data.videoURL}#t=0.5`;

            el.innerHTML = `
                <div class="thumb-wrap">
                    <video src="${videoThumb}" muted preload="metadata"></video>
                    <div class="play-hint"><svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
                    <div class="gender-tag">${targetIcon} <span>${(data.target || 'General').toUpperCase()}</span></div>
                    <div class="time-tag">${timeAgo}</div>
                </div>
                <div class="card-body">
                    <div class="avatar">${(data.username || 'U').charAt(0).toUpperCase()}</div>
                    <div class="meta">
                        <h3>${data.title || 'Untitled Elite Experience'}</h3>
                        <p>${data.username || 'Elite Member'} • ${data.views || 0} views</p>
                    </div>
                </div>
            `;
            return el;
        }

        // 4. Utils
        function formatTime(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + " years ago";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + " months ago";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + " days ago";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + " hours ago";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + " mins ago";
            return "Just now";
        }

        // 5. Interaction Listeners
        document.querySelectorAll('.chip').forEach(chip => {
            chip.onclick = () => {
                document.querySelector('.chip.active').classList.remove('active');
                chip.classList.add('active');
                currentCategory = chip.dataset.cat;
                fetchVideos();
            };
        });

        document.getElementById('loadMoreBtn').onclick = () => fetchVideos(true);

        // Real-time Search (Local)
        document.getElementById('searchInput').oninput = (e) => {
            const val = e.target.value.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                const title = card.querySelector('h3').innerText.toLowerCase();
                card.style.display = title.includes(val) ? 'block' : 'none';
            });
        };

        // Inject Components
        const inject = (url, target) => {
            fetch(url).then(r => r.text()).then(html => {
                document.getElementById(target).innerHTML = html;
                const scripts = document.getElementById(target).getElementsByTagName('script');
                for (let s of scripts) eval(s.innerText);
            });
        };
        inject('./imp/nav-dock-button.html', 'navDockContainer');
        inject('./imp/loader.html', 'loaderContainer');

    </script>
</body>
</html>
