<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexy Hub - Luxury Feed</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --accent: #6366f1;
            --bg: #f8fafc;
            --card: #ffffff;
            --glass: rgba(255, 255, 255, 0.8);
            --border: #f1f5f9;
            --shadow: 0 20px 40px rgba(0,0,0,0.04);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #0f172a;
            overflow-x: hidden;
        }

        /* --- LUXURY HEADER --- */
        .top-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1000; border-bottom: 1px solid var(--border);
        }

        .search-box {
            flex: 1; max-width: 400px; position: relative; margin: 0 20px;
        }

        .search-box input {
            width: 100%; padding: 12px 20px 12px 45px; border-radius: 14px;
            border: 1.5px solid var(--border); background: #f1f5f9;
            font-size: 14px; font-weight: 500; outline: none; transition: var(--transition);
        }

        .search-box input:focus { border-color: var(--primary); background: white; }

        .search-box svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); fill: #94a3b8; width: 18px; }

        /* --- CATEGORY CHIPS --- */
        .category-bar {
            display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto;
            background: white; border-bottom: 1px solid var(--border);
            margin-top: 70px; scrollbar-width: none;
        }
        .category-bar::-webkit-scrollbar { display: none; }

        .chip {
            padding: 8px 18px; border-radius: 12px; background: #f1f5f9;
            font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer;
            transition: var(--transition); border: 1.5px solid transparent;
        }
        .chip.active { background: var(--primary); color: white; }

        /* --- MAIN LAYOUT --- */
        .main-content {
            padding: 20px; padding-bottom: 100px;
            max-width: 1200px; margin: 0 auto;
        }

        @media (min-width: 768px) { body { padding-left: 80px; } }

        /* --- LUXURY GRID (1 on Mobile, 2 on PC) --- */
        .feed-grid {
            display: grid; grid-template-columns: 1fr; gap: 25px;
        }

        @media (min-width: 768px) { .feed-grid { grid-template-columns: 1fr 1fr; } }

        /* --- VIDEO CARD --- */
        .card {
            background: var(--card); border-radius: 28px; overflow: hidden;
            box-shadow: var(--shadow); border: 1px solid white; transition: var(--transition);
        }

        .card:hover { transform: translateY(-5px); box-shadow: 0 30px 60px rgba(0,0,0,0.08); }

        .video-container {
            width: 100%; aspect-ratio: 16/9; background: #000;
            position: relative; cursor: pointer; overflow: hidden;
        }

        .video-container video { width: 100%; height: 100%; object-fit: cover; }

        /* Gender Badge */
        .gender-badge {
            position: absolute; top: 15px; left: 15px; padding: 6px 12px;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
            border-radius: 10px; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 5px;
        }

        /* Duration Badge */
        .duration {
            position: absolute; bottom: 12px; right: 12px; padding: 4px 8px;
            background: rgba(0,0,0,0.7); color: white; border-radius: 6px; font-size: 11px; font-weight: 600;
        }

        .card-info { padding: 20px; display: flex; gap: 15px; }

        .uploader-avatar {
            width: 45px; height: 45px; border-radius: 50%; background: #e2e8f0;
            display: flex; justify-content: center; align-items: center; font-weight: 800; color: #64748b;
            flex-shrink: 0;
        }

        .text-wrap h3 { font-size: 16px; font-weight: 800; line-height: 1.3; margin-bottom: 5px; }
        .text-wrap p { font-size: 13px; color: #64748b; font-weight: 600; }

        /* --- AD SYSTEM --- */
        .luxury-ad {
            grid-column: 1 / -1; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 24px; padding: 30px; color: white; position: relative;
            overflow: hidden; text-align: center; margin: 10px 0;
        }
        .ad-label { position: absolute; top: 10px; right: 15px; font-size: 10px; opacity: 0.5; font-weight: 800; }
        .ad-btn {
            display: inline-block; margin-top: 15px; padding: 10px 25px;
            background: white; color: var(--primary); border-radius: 12px;
            text-decoration: none; font-weight: 800; font-size: 13px;
        }

        /* --- PAGINATION BUTTON --- */
        .load-more {
            width: 100%; padding: 18px; margin-top: 30px; border-radius: 20px;
            background: white; border: 2px solid var(--border); font-size: 15px;
            font-weight: 800; cursor: pointer; transition: var(--transition);
        }
        .load-more:active { transform: scale(0.98); background: #f1f5f9; }

        /* Skeleton */
        .skeleton { background: #e2e8f0; border-radius: 20px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

    </style>
</head>
<body>

    <div id="navDockContainer"></div>
    <div id="loaderContainer"></div>

    <!-- Header -->
    <header class="top-header">
        <div style="font-weight: 800; font-size: 22px; letter-spacing: -1px;">Nexy Hub</div>
        
        <div class="search-box">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="Search elite content...">
        </div>

        <div style="width: 40px; height: 40px; background: #e2e8f0; border-radius: 50%; cursor: pointer;" onclick="window.location.href='profile.html'"></div>
    </header>

    <!-- Categories -->
    <div class="category-bar">
        <div class="chip active">All Elite</div>
        <div class="chip">Trending</div>
        <div class="chip">Action</div>
        <div class="chip">Luxury Life</div>
        <div class="chip">Community</div>
        <div class="chip">Gaming</div>
        <div class="chip">Music</div>
    </div>

    <!-- Main Feed -->
    <main class="main-content">
        <!-- Ad Banner -->
        <div class="luxury-ad">
            <span class="ad-label">SPONSORED</span>
            <h2 style="font-size: 20px; font-weight: 800;">Nexy Premium Access</h2>
            <p style="font-size: 13px; opacity: 0.7; margin-top: 5px;">Unlock exclusive content and zero ads today.</p>
            <a href="#" class="ad-btn">Upgrade Elite</a>
        </div>

        <div class="feed-grid" id="videoGrid">
            <!-- Skeleton cards initially -->
            <div class="skeleton" style="height: 250px;"></div>
            <div class="skeleton" style="height: 250px;"></div>
        </div>

        <button class="load-more" id="loadMoreBtn">Explore More Content</button>
    </main>

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, query, orderBy, limit, getDocs, startAfter } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db } from "./imp/firebase-config.js";

        let lastVisible = null;
        let isLoading = false;

        // 1. Auth Check
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.replace("login.html");
            else fetchVideos();
        });

        // 2. Fetch Logic
        async function fetchVideos(isLoadMore = false) {
            if (isLoading) return;
            isLoading = true;
            const grid = document.getElementById('videoGrid');

            try {
                let q = query(collection(db, "videos"), orderBy("createdAt", "desc"), limit(10));
                
                if (isLoadMore && lastVisible) {
                    q = query(collection(db, "videos"), orderBy("createdAt", "desc"), startAfter(lastVisible), limit(10));
                } else {
                    grid.innerHTML = ''; // Clear skeletons
                }

                const snap = await getDocs(q);
                if (snap.empty) {
                    document.getElementById('loadMoreBtn').innerText = "All caught up!";
                    return;
                }

                lastVisible = snap.docs[snap.docs.length - 1];

                snap.forEach(doc => {
                    const data = doc.data();
                    grid.appendChild(createVideoCard(data));
                });

            } catch (e) {
                console.error(e);
            } finally {
                isLoading = false;
            }
        }

        // 3. UI Generator
        function createVideoCard(data) {
            const el = document.createElement('div');
            el.className = 'card';
            
            // Gender logic
            let genderIcon = "👨";
            if (data.target === 'female') genderIcon = "👩";
            if (data.target === 'kids') genderIcon = "👶";

            el.innerHTML = `
                <div class="video-container" onclick="playVideo(this)">
                    <video src="${data.videoURL}" poster="${data.thumbnail || ''}" playsinline></video>
                    <div class="gender-badge">${genderIcon} <span>${data.target || 'General'}</span></div>
                    <div class="duration">4:20</div>
                </div>
                <div class="card-info">
                    <div class="uploader-avatar">${data.username?.charAt(0) || 'U'}</div>
                    <div class="text-wrap">
                        <h3>${data.title || 'Untitled Luxury Video'}</h3>
                        <p>${data.username || 'Elite Creator'} • ${data.views || 0} views</p>
                    </div>
                </div>
            `;
            return el;
        }

        // 4. Player Logic
        window.playVideo = (container) => {
            const vid = container.querySelector('video');
            if (vid.paused) {
                document.querySelectorAll('video').forEach(v => v.pause());
                vid.play();
                vid.controls = true;
            } else {
                vid.pause();
                vid.controls = false;
            }
        };

        // 5. Category Chips Logic
        document.querySelectorAll('.chip').forEach(chip => {
            chip.onclick = () => {
                document.querySelector('.chip.active').classList.remove('active');
                chip.classList.add('active');
                // Real implementation: Refetch videos with a firestore 'where' clause
                fetchVideos();
            };
        });

        document.getElementById('loadMoreBtn').onclick = () => fetchVideos(true);

        // Inject Nav & Loader
        const inject = (url, target) => {
            fetch(url).then(r => r.text()).then(html => {
                document.getElementById(target).innerHTML = html;
                const scripts = document.getElementById(target).getElementsByTagName('script');
                for (let s of scripts) eval(s.innerText);
            });
        };
        inject('./imp/nav-dock-button.html', 'navDockContainer');
        inject('./imp/loader.html', 'loaderContainer');

    </script>
</body>
</html>
