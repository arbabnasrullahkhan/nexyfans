<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexy Hub - Luxury Feed</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --accent: #6366f1;
            --bg: #fdfdfe;
            --card: #ffffff;
            --glass: rgba(255, 255, 255, 0.8);
            --border: rgba(241, 245, 249, 0.8);
            --shadow: 0 30px 60px -12px rgba(0,0,0,0.06);
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #0f172a;
            overflow-x: hidden;
        }

        /* --- LUXURY STICKY HEADER --- */
        .top-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 75px;
            background: var(--glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 25px; z-index: 1000; border-bottom: 1.5px solid var(--border);
        }

        .logo-box { font-weight: 900; font-size: 24px; letter-spacing: -1.5px; cursor: pointer; }

        .search-box { flex: 1; max-width: 550px; position: relative; margin: 0 30px; }
        .search-box input {
            width: 100%; padding: 14px 20px 14px 50px; border-radius: 18px;
            border: 1.5px solid var(--border); background: #f1f5f9;
            font-size: 14px; font-weight: 600; outline: none; transition: var(--transition);
        }
        .search-box input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 5px rgba(0,0,0,0.02); }
        .search-box svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); fill: #94a3b8; width: 20px; }

        /* --- MAIN LAYOUT --- */
        .main-content {
            padding: 100px 24px 120px;
            max-width: 1400px; margin: 0 auto;
        }

        @media (min-width: 768px) { body { padding-left: 80px; } }

        /* --- FEED GRID (Luxury 4K Look) --- */
        .feed-grid { display: grid; grid-template-columns: 1fr; gap: 35px; }
        @media (min-width: 768px) { .feed-grid { grid-template-columns: 1fr 1fr; } }
        @media (min-width: 1200px) { .feed-grid { grid-template-columns: 1fr 1fr 1fr; } }

        /* --- PREMIUM CARD UI --- */
        .card {
            background: var(--card); border-radius: 35px; overflow: hidden;
            box-shadow: var(--shadow); border: 1.5px solid #ffffff; transition: var(--transition);
            cursor: pointer; position: relative;
        }

        .card:hover { transform: translateY(-12px) scale(1.02); box-shadow: 0 40px 80px rgba(0,0,0,0.1); }

        .thumb-area {
            width: 100%; aspect-ratio: 16/9; background: #000;
            position: relative; overflow: hidden;
        }

        /* Thumbnail Image display */
        .thumb-area img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s ease; }
        .card:hover .thumb-area img { transform: scale(1.1); }

        .play-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.1); display: flex; justify-content: center; align-items: center;
            opacity: 0; transition: 0.3s;
        }
        .card:hover .play-overlay { opacity: 1; background: rgba(0,0,0,0.3); }
        .play-btn-icon { width: 60px; height: 60px; background: rgba(255,255,255,0.25); backdrop-filter: blur(15px); border-radius: 50%; display: flex; justify-content: center; align-items: center; }

        .tag-row { position: absolute; top: 20px; left: 20px; display: flex; gap: 10px; }
        .glass-tag {
            padding: 7px 14px; background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);
            border-radius: 14px; font-size: 11px; font-weight: 800; text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .duration-tag {
            position: absolute; bottom: 15px; right: 20px; padding: 5px 10px;
            background: rgba(0,0,0,0.7); color: #fff; border-radius: 9px; font-size: 11px; font-weight: 700;
        }

        .card-footer { padding: 22px; display: flex; gap: 18px; }
        .u-avatar {
            width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            display: flex; justify-content: center; align-items: center; font-weight: 800; color: #1e293b;
            flex-shrink: 0; border: 2.5px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .v-meta h3 { font-size: 17px; font-weight: 800; line-height: 1.4; color: #0f172a; margin-bottom: 6px; 
                   display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .v-meta p { font-size: 13px; color: #64748b; font-weight: 600; }

        /* --- SKELETON LOADERS --- */
        .skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 30px; height: 320px; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Ad Placement */
        .premium-ad { grid-column: 1/-1; background: #000; border-radius: 35px; padding: 40px; color: #fff; text-align: center; position: relative; overflow: hidden; margin: 15px 0; }
        .premium-ad h2 { font-size: 24px; font-weight: 900; margin-bottom: 10px; }
        .ad-btn { display: inline-block; padding: 12px 30px; background: #fff; color: #000; border-radius: 15px; font-weight: 800; text-decoration: none; margin-top: 15px; }

    </style>
</head>
<body>

    <div id="navDockContainer"></div>
    <div id="loaderContainer"></div>

    <header class="top-header">
        <div class="logo-box">NEXY HUB</div>
        
        <div class="search-box">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="Search elite content...">
        </div>

        <div style="width: 48px; height: 48px; background: #e2e8f0; border-radius: 50%; cursor: pointer; border: 3px solid white; box-shadow: var(--shadow);" onclick="window.location.href='profile.html'"></div>
    </header>

    <main class="main-content">
        <div class="feed-grid" id="videoGrid">
            <!-- Loading Skeletons -->
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </div>
    </main>

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db } from "./imp/firebase-config.js";

        // 1. Check Login
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.replace("login.html");
            else fetchEliteContent();
        });

        // 2. Fetch Firestore Content
        async function fetchEliteContent() {
            const grid = document.getElementById('videoGrid');
            try {
                const q = query(collection(db, "videos"), orderBy("createdAt", "desc"), limit(12));
                const snap = await getDocs(q);
                
                grid.innerHTML = ''; // Clear skeletons

                if (snap.empty) {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:100px; font-weight:800; opacity:0.4;">NO ELITE CONTENT FOUND</div>';
                    return;
                }

                // Add Ad Banner after 3 cards
                let count = 0;
                snap.forEach(doc => {
                    count++;
                    const data = doc.data();
                    grid.appendChild(createLuxuryCard(data, doc.id));
                    
                    if (count === 3) {
                        grid.appendChild(createAdBanner());
                    }
                });

            } catch (e) {
                console.error("Critical Sync Error:", e);
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:red;">Elite Sync Error. Refresh.</div>';
            }
        }

        // 3. Luxury Card Component
        function createLuxuryCard(data, id) {
            const el = document.createElement('div');
            el.className = 'card';
            el.onclick = () => window.location.href = `video-player.html?v=${id}`;

            // Handle Broken Video Links with Thumbnail Fallback
            // If upload.html saved a base64 thumbnail, we show that image
            const thumbSrc = data.thumbnail || "https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=1000&auto=format&fit=crop";

            el.innerHTML = `
                <div class="thumb-area">
                    <img src="${thumbSrc}" loading="lazy">
                    <div class="play-overlay">
                        <div class="play-btn-icon">
                            <svg width="28" height="28" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                    </div>
                    <div class="tag-row">
                        <div class="glass-tag">Elite</div>
                        <div class="glass-tag" style="background:var(--accent); color:#fff;">${data.category || 'Luxury'}</div>
                    </div>
                    <div class="duration-tag">4K Premium</div>
                </div>
                <div class="card-footer">
                    <div class="u-avatar">${(data.username || 'U').charAt(0).toUpperCase()}</div>
                    <div class="v-meta">
                        <h3>${data.title || 'Untitled Elite Experience'}</h3>
                        <p>${data.username || 'Elite Member'} • ${data.views || 0} views</p>
                    </div>
                </div>
            `;
            return el;
        }

        function createAdBanner() {
            const ad = document.createElement('div');
            ad.className = 'premium-ad';
            ad.innerHTML = `
                <h2>NEXY HUB PREMIUM</h2>
                <p style="opacity:0.7; font-weight:600;">Remove all ads and unlock 8K Elite Streaming.</p>
                <a href="#" class="ad-btn">Upgrade Now</a>
            `;
            return ad;
        }

        // Injection
        const inject = (url, target) => {
            fetch(url).then(r => r.text()).then(html => {
                document.getElementById(target).innerHTML = html;
                const scripts = document.getElementById(target).getElementsByTagName('script');
                for (let s of scripts) eval(s.innerText);
            });
        };
        inject('./imp/nav-dock-button.html', 'navDockContainer');
        inject('./imp/loader.html', 'loaderContainer');

    </script>
</body>
</html>
