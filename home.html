<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexy Hub | Elite Feed</title>
    
    <!-- Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --accent: #6366f1;
            --bg: #ffffff;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #f1f5f9;
            --glass: rgba(255, 255, 255, 0.8);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- LUXURY HEADER --- */
        .top-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: var(--glass); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1000; border-bottom: 1px solid var(--border);
        }

        .logo-wrap { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 22px; letter-spacing: -1px; }
        .logo-wrap .icon { width: 32px; height: 32px; background: var(--primary); border-radius: 10px; display: flex; justify-content: center; align-items: center; }

        /* Expanding Search Bar */
        .search-container { position: relative; display: flex; align-items: center; }
        .search-input {
            width: 40px; height: 40px; background: #f1f5f9; border: none; border-radius: 20px;
            padding: 0 15px 0 40px; outline: none; transition: var(--transition); cursor: pointer;
        }
        .search-input:focus { width: 220px; background: white; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: 1.5px solid #e2e8f0; }
        .search-icon { position: absolute; left: 12px; pointer-events: none; }

        /* --- CATEGORY HUB --- */
        .category-bar {
            position: fixed; top: 70px; left: 0; width: 100%; height: 60px;
            background: var(--bg); display: flex; align-items: center;
            padding: 0 16px; gap: 10px; overflow-x: auto; scrollbar-width: none;
            z-index: 999; border-bottom: 1px solid var(--border);
        }
        .category-bar::-webkit-scrollbar { display: none; }
        .cat-chip {
            white-space: nowrap; padding: 10px 18px; border-radius: 14px;
            background: #f1f5f9; font-size: 13px; font-weight: 700; color: var(--text-sub);
            cursor: pointer; transition: var(--transition); border: 1px solid transparent;
        }
        .cat-chip.active { background: var(--primary); color: white; transform: scale(1.05); }

        /* --- FEED LAYOUT --- */
        .main-content {
            padding-top: 140px; padding-bottom: 100px;
            display: flex; flex-direction: column; align-items: center;
        }

        .feed-grid { width: 100%; max-width: 550px; display: flex; flex-direction: column; gap: 30px; padding: 0 16px; }

        /* --- LUXURY VIDEO CARD --- */
        .video-card {
            background: var(--card); border-radius: 35px; overflow: hidden;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.05);
            animation: cardEntrance 0.8s ease-out backwards;
        }

        @keyframes cardEntrance { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .card-head { padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; }
        .user-meta { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 44px; height: 44px; border-radius: 15px; background: #f1f5f9; border: 2px solid white; display: flex; justify-content: center; align-items: center; font-weight: 800; color: #94a3b8; }
        .user-name { font-size: 15px; font-weight: 700; color: var(--text-main); }
        .v-status { font-size: 11px; color: var(--accent); font-weight: 800; text-transform: uppercase; }

        /* Premium Video Player */
        .player-box {
            position: relative; width: 100%; aspect-ratio: 16/10; background: #000;
            cursor: pointer; overflow: hidden;
        }
        .player-box video { width: 100%; height: 100%; object-fit: cover; }
        .luxury-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center;
            opacity: 0; transition: 0.3s;
        }
        .player-box.paused .luxury-overlay { opacity: 1; }
        .play-btn { width: 60px; height: 60px; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 1.5px solid rgba(255,255,255,0.4); }

        .card-info { padding: 20px; }
        .v-title { font-size: 16px; font-weight: 700; margin-bottom: 15px; line-height: 1.4; }

        .v-actions { display: flex; justify-content: space-between; align-items: center; }
        .act-group { display: flex; gap: 20px; }
        .act-item { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--text-sub); transition: 0.2s; }
        .act-item svg { width: 22px; height: 22px; }
        .act-item.liked { color: #ff2d55; }
        .act-item.liked svg { fill: #ff2d55; stroke: #ff2d55; }

        /* --- AD PLACEHOLDER --- */
        .luxury-ad {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border-radius: 30px; padding: 25px; border: 2px dashed #cbd5e1;
            text-align: center; color: #94a3b8; font-weight: 700; font-size: 13px;
        }

        /* --- DESKTOP SIDEBAR --- */
        @media (min-width: 1024px) {
            body { padding-left: 280px; }
            .top-header { left: 280px; width: calc(100% - 280px); }
            .category-bar { left: 280px; width: calc(100% - 280px); }
            .desktop-sidebar {
                position: fixed; top: 0; left: 0; width: 280px; height: 100vh;
                background: white; border-right: 1px solid var(--border);
                display: flex; flex-direction: column; padding: 30px; z-index: 1001;
            }
        }

        @media (max-width: 1023px) { .desktop-sidebar { display: none; } }

        /* --- SKELETON --- */
        .skeleton { height: 300px; background: #f1f5f9; border-radius: 35px; position: relative; overflow: hidden; }
        .skeleton::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); animation: shimer 1.5s infinite; }
        @keyframes shimer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

    </style>
</head>
<body>

    <!-- Desktop Sidebar -->
    <aside class="desktop-sidebar">
        <div class="logo-wrap" style="margin-bottom: 50px;">
            <div class="icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M8 5.14V18.86C8 19.75 8.97 20.29 9.72 19.82L20.59 13.06C21.28 12.63 21.28 11.64 20.59 11.21L9.72 4.45C8.97 3.98 8 4.52 8 5.14Z"/></svg>
            </div>
            <span>Nexy Hub</span>
        </div>
        <nav style="display: flex; flex-direction: column; gap: 25px;">
            <div class="cat-chip active">Feed</div>
            <div class="cat-chip" onclick="window.location.href='reel.html'">Shorts</div>
            <div class="cat-chip" onclick="window.location.href='chat.html'">Community</div>
            <div class="cat-chip" onclick="window.location.href='profile.html'">My Profile</div>
            <div class="cat-chip" onclick="window.location.href='settings.html'">Elite Settings</div>
        </nav>
    </aside>

    <!-- Top Navigation -->
    <header class="top-header">
        <div class="logo-wrap">
            <div class="icon">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="white"><path d="M8 5.14V18.86C8 19.75 8.97 20.29 9.72 19.82L20.59 13.06C21.28 12.63 21.28 11.64 20.59 11.21L9.72 4.45C8.97 3.98 8 4.52 8 5.14Z"/></svg>
            </div>
            <span class="mobile-hide">Nexy Hub</span>
        </div>

        <div class="search-container">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" class="search-input" id="searchBar" placeholder="Search elite content...">
        </div>

        <div class="header-actions">
            <button class="icon-btn" onclick="window.location.href='notifications.html'">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </button>
        </div>
    </header>

    <!-- Category Hub -->
    <div class="category-bar">
        <div class="cat-chip active" onclick="filterFeed('all')">For You</div>
        <div class="cat-chip" onclick="filterFeed('trending')">Trending</div>
        <div class="cat-chip" onclick="filterFeed('verified')">Verified</div>
        <div class="cat-chip" onclick="filterFeed('male')">Elite Men</div>
        <div class="cat-chip" onclick="filterFeed('female')">Elite Women</div>
        <div class="cat-chip" onclick="filterFeed('shorts')">Shorts</div>
    </div>

    <!-- Main Feed -->
    <main class="main-content">
        <div class="feed-grid" id="feedContainer">
            <!-- Skeleton Screen -->
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </div>
    </main>

    <!-- Navigation Dock Container -->
    <div id="navDockPlaceholder"></div>

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, query, orderBy, limit, getDocs, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db } from "./imp/firebase-config.js";

        const container = document.getElementById('feedContainer');
        const searchBar = document.getElementById('searchBar');

        // 1. Auth Guard & Nav Dock
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.replace('login.html');
            else fetchFeed('all');
        });

        async function loadNav() {
            const res = await fetch('./imp/nav-dock-button.html');
            if(res.ok) document.getElementById('navDockPlaceholder').innerHTML = await res.text();
        }
        loadNav();

        // 2. Fetch Elite Feed
        async function fetchFeed(category) {
            container.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
            
            try {
                let q = query(collection(db, "videos"), orderBy("createdAt", "desc"), limit(20));
                
                if(category !== 'all') {
                    // Logic for categories (Assumes 'type' or 'category' field in Firestore)
                    // e.g. where("gender", "==", category)
                }

                const snap = await getDocs(q);
                container.innerHTML = '';

                if (snap.empty) {
                    container.innerHTML = `<div class="luxury-ad">No elite content found in this category. Be the first to upload!</div>`;
                }

                snap.forEach((doc, index) => {
                    // Inject Ad every 3 videos
                    if (index > 0 && index % 3 === 0) {
                        const ad = document.createElement('div');
                        ad.className = 'luxury-ad';
                        ad.innerText = "Nexy Premium: Experience 0% Ads & 100% Elite Access";
                        container.appendChild(ad);
                    }
                    const data = doc.data();
                    container.appendChild(createVideoCard(data, doc.id));
                });

                initIntersectionObserver();

            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="luxury-ad">Connectivity Error. Please refresh.</div>';
            }
        }

        // 3. UI Generator: Luxury Video Card
        function createVideoCard(data, id) {
            const card = document.createElement('div');
            card.className = 'video-card';
            
            card.innerHTML = `
                <div class="card-head">
                    <div class="user-meta">
                        <div class="user-avatar">${data.name?.charAt(0) || 'U'}</div>
                        <div>
                            <p class="user-name">${data.name || 'Anonymous Elite'}</p>
                            <p class="v-status">Elite Member • Verified</p>
                        </div>
                    </div>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                </div>

                <div class="player-box paused" onclick="handlePlay(this)">
                    <video loop playsinline src="${data.videoURL}"></video>
                    <div class="luxury-overlay">
                        <div class="play-btn">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M8 5.14V18.86C8 19.75 8.97 20.29 9.72 19.82L20.59 13.06C21.28 12.63 21.28 11.64 20.59 11.21L9.72 4.45C8.97 3.98 8 4.52 8 5.14Z"/></svg>
                        </div>
                    </div>
                </div>

                <div class="card-info">
                    <h3 class="v-title">${data.title || 'Untitled Elite Content'}</h3>
                    <div class="v-actions">
                        <div class="act-group">
                            <div class="act-item" onclick="toggleLike(this)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                <span>${data.likes || 0}</span>
                            </div>
                            <div class="act-item">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                                <span>Elite Reply</span>
                            </div>
                        </div>
                        <div class="act-item" onclick="shareContent('${data.videoURL}')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        // 4. Power Functions
        window.handlePlay = (el) => {
            const v = el.querySelector('video');
            if (v.paused) {
                v.play();
                el.classList.remove('paused');
            } else {
                v.pause();
                el.classList.add('paused');
            }
        };

        window.toggleLike = (el) => {
            el.classList.toggle('liked');
            let count = parseInt(el.querySelector('span').innerText);
            el.querySelector('span').innerText = el.classList.contains('liked') ? count + 1 : count - 1;
        };

        window.filterFeed = (cat) => {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            fetchFeed(cat);
        };

        // 5. Search Logic
        searchBar.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.video-card');
            cards.forEach(card => {
                const title = card.querySelector('.v-title').innerText.toLowerCase();
                card.style.display = title.includes(term) ? 'block' : 'none';
            });
        });

        // 6. Intersection Observer for Autoplay (YouTube Style)
        function initIntersectionObserver() {
            const options = { threshold: 0.7 };
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (entry.isIntersecting) {
                        video.play();
                        entry.target.classList.remove('paused');
                    } else {
                        video.pause();
                        entry.target.classList.add('paused');
                    }
                });
            }, options);

            document.querySelectorAll('.player-box').forEach(box => observer.observe(box));
        }

        window.shareContent = (url) => {
            if (navigator.share) {
                navigator.share({ title: 'Nexy Elite Content', url: url });
            } else {
                navigator.clipboard.writeText(url);
                alert("Elite Link Copied!");
            }
        };

    </script>
</body>
</html>
