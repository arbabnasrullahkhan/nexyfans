<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Sign In - Nexy Hub</title>
    
    <!-- Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --accent: #6366f1;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --error: #ef4444;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Luxury Background Mesh */
        .luxury-mesh {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 100% 0%, #e2e8f0 0%, transparent 40%),
                        radial-gradient(circle at 0% 100%, #f1f5f9 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 60px 24px;
            display: flex;
            flex-direction: column;
        }

        /* Back Button */
        .back-nav {
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeIn 0.8s forwards;
        }

        .btn-circle {
            width: 50px; height: 50px; border-radius: 50%;
            background: white; border: 1.5px solid #f1f5f9;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: var(--transition);
        }

        .btn-circle:active { transform: scale(0.9); background: #f8fafc; }

        /* Header */
        .header { margin-bottom: 40px; }
        .title { font-size: 32px; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 10px; }
        .subtitle { font-size: 16px; color: #64748b; font-weight: 500; }

        /* Form Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid white;
            border-radius: 35px;
            padding: 35px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        .form-group { margin-bottom: 24px; opacity: 0; transform: translateY(15px); animation: slideUp 0.6s forwards; }
        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }

        .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 0 4px; }
        label { font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.8px; }
        .forgot-pass { font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: none; }

        input {
            width: 100%; padding: 18px; border-radius: 20px; border: 1.5px solid #e2e8f0;
            background: white; font-size: 16px; font-weight: 500; outline: none; transition: var(--transition);
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 0 5px rgba(0,0,0,0.03); }

        /* Buttons */
        .btn {
            width: 100%; padding: 18px; border-radius: 20px; font-size: 16px; font-weight: 700;
            cursor: pointer; border: none; transition: var(--transition);
            display: flex; justify-content: center; align-items: center; gap: 12px;
        }

        .btn-primary { background: var(--primary); color: white; margin-top: 10px; box-shadow: 0 15px 30px rgba(0,0,0,0.15); }
        .btn-primary:active { transform: scale(0.97); }

        .btn-google { background: white; border: 1.5px solid #e2e8f0; color: var(--text); margin-top: 25px; }

        .divider { display: flex; align-items: center; margin: 30px 0; color: #cbd5e1; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1.5px; background: #f1f5f9; }
        .divider span { padding: 0 20px; }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(12px);
            z-index: 1000; display: none; justify-content: center; align-items: center; padding: 24px;
        }

        .modal {
            background: white; padding: 35px; border-radius: 35px; width: 100%; max-width: 380px;
            text-align: center; animation: modalPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-icon { width: 70px; height: 70px; background: #fef2f2; border-radius: 22px; display: flex; justify-content: center; align-items: center; margin: 0 auto 25px; }
        .modal-icon svg { fill: var(--error); width: 35px; height: 35px; }
        .modal-title { font-size: 22px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.5px; }
        .modal-text { font-size: 15px; color: #64748b; line-height: 1.6; margin-bottom: 30px; }

        /* Loader */
        .spinner { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .footer-link { text-align: center; margin-top: 40px; font-size: 15px; color: #64748b; font-weight: 500; }
        .footer-link a { color: var(--primary); font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>

    <div class="luxury-mesh"></div>

    <div class="container">
        <nav class="back-nav">
            <div class="btn-circle" onclick="window.location.href='welcome.html'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </div>
        </nav>

        <div class="header">
            <h1 class="title">Elite Access</h1>
            <p class="subtitle">Welcome back to the premium hub.</p>
        </div>

        <div class="glass-card">
            <form id="loginForm">
                <div class="form-group">
                    <div class="label-row">
                        <label>Email Address</label>
                    </div>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label>Security Key</label>
                        <a href="forgot.html" class="forgot-pass">Forgot?</a>
                    </div>
                    <input type="password" id="pass" placeholder="********" required>
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span>Sign In</span>
                    <div class="spinner" id="spinner"></div>
                </button>
            </form>

            <div class="divider"><span>Secured Login</span></div>

            <button class="btn btn-google" id="googleBtn">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Google Elite
            </button>
        </div>

        <p class="footer-link">
            Not a member? <a href="register.html">Apply for Access</a>
        </p>
    </div>

    <!-- Suspension / Error Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            </div>
            <h2 class="modal-title" id="modalTitle">Account Locked</h2>
            <p class="modal-text" id="modalMsg">Your account has been suspended due to the weekly upload rule.</p>
            <button class="btn btn-primary" onclick="location.reload()">I Understand</button>
        </div>
    </div>

    <script type="module">
        import { signInWithEmailAndPassword, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db, googleProvider } from "./imp/firebase-config.js";

        const form = document.getElementById('loginForm');
        const overlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalMsg = document.getElementById('modalMsg');

        function showError(title, msg) {
            modalTitle.innerText = title;
            modalMsg.innerText = msg;
            overlay.style.display = 'flex';
        }

        async function checkUserStatus(uid) {
            const snap = await getDoc(doc(db, "users", uid));
            if (snap.exists()) {
                const data = snap.data();
                if (data.status === 'suspended') {
                    await signOut(auth);
                    showError("Access Denied", "Your elite account is suspended. Please contact the help center for restoration.");
                    return false;
                }
                return true;
            }
            return false;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const spinner = document.getElementById('spinner');
            
            btn.children[0].style.display = 'none';
            spinner.style.display = 'block';

            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;

            try {
                const cred = await signInWithEmailAndPassword(auth, email, pass);
                const isActive = await checkUserStatus(cred.user.uid);
                if (isActive) window.location.replace('home.html');
            } catch (err) {
                btn.children[0].style.display = 'block';
                spinner.style.display = 'none';
                showError("Login Failed", "Invalid credentials or account does not exist.");
            }
        });

        document.getElementById('googleBtn').onclick = async () => {
            try {
                const res = await signInWithPopup(auth, googleProvider);
                const isActive = await checkUserStatus(res.user.uid);
                
                // If new user via Google, create basic elite profile
                if (!isActive) {
                    const snap = await getDoc(doc(db, "users", res.user.uid));
                    if (!snap.exists()) {
                        await setDoc(doc(db, "users", res.user.uid), {
                            uid: res.user.uid,
                            name: res.user.displayName,
                            email: res.user.email,
                            role: 'user',
                            status: 'active',
                            createdAt: serverTimestamp()
                        });
                        window.location.replace('home.html');
                    }
                } else {
                    window.location.replace('home.html');
                }
            } catch (err) {
                console.error(err);
            }
        };
    </script>
</body>
</html>
