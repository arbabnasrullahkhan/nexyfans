<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexy Hub - Luxury Cinema</title>
    
    <!-- Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --accent: #6366f1;
            --bg: #ffffff;
            --glass: rgba(255, 255, 255, 0.9);
            --border: #f1f5f9;
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #0f172a;
            overflow-x: hidden;
        }

        /* --- LUXURY HEADER --- */
        .player-header {
            position: sticky; top: 0; width: 100%; height: 70px;
            background: var(--glass); backdrop-filter: blur(25px);
            display: flex; align-items: center; padding: 0 20px;
            z-index: 1000; border-bottom: 1.5px solid var(--border);
            justify-content: space-between;
        }

        .back-circle {
            width: 45px; height: 45px; border-radius: 50%; background: #f8fafc;
            display: flex; justify-content: center; align-items: center;
            border: 1.5px solid var(--border); cursor: pointer; transition: var(--transition);
        }
        .back-circle:active { transform: scale(0.9); }

        /* --- THEATER PLAYER --- */
        .video-stage {
            width: 100%; background: #000; position: relative;
            aspect-ratio: 16/9; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
        }

        video { width: 100%; height: 100%; object-fit: contain; }

        /* Processing/Error Placeholder */
        #statusOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e293b 0%, #000000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; padding: 30px; z-index: 10;
        }

        .loader-ring {
            width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #fff; border-radius: 50%; animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        /* --- CONTENT DETAILS --- */
        .content-wrap { padding: 25px 20px; max-width: 1000px; margin: 0 auto; }

        .v-title { font-size: 22px; font-weight: 800; line-height: 1.3; margin-bottom: 8px; letter-spacing: -0.5px; }
        .v-stats { font-size: 13px; color: #64748b; font-weight: 600; margin-bottom: 25px; }

        /* Action Buttons */
        .actions-row {
            display: flex; gap: 12px; overflow-x: auto; padding-bottom: 15px;
            scrollbar-width: none; border-bottom: 1.5px solid var(--border); margin-bottom: 25px;
        }
        .actions-row::-webkit-scrollbar { display: none; }

        .btn-pill {
            padding: 12px 24px; border-radius: 30px; background: #f1f5f9;
            border: 1.5px solid #e2e8f0; font-size: 13px; font-weight: 700;
            display: flex; align-items: center; gap: 8px; cursor: pointer; transition: var(--transition);
            white-space: nowrap;
        }
        .btn-pill.active { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-pill svg { width: 18px; height: 18px; fill: currentColor; }

        /* Creator Card */
        .creator-card {
            display: flex; align-items: center; justify-content: space-between;
            background: #f8fafc; padding: 18px; border-radius: 25px;
            border: 1.5px solid var(--border); margin-bottom: 30px;
        }

        .c-profile { display: flex; align-items: center; gap: 15px; }
        .c-avatar { width: 50px; height: 50px; border-radius: 50%; background: #000; color: #fff;
                    display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 18px; }

        .c-info h4 { font-size: 16px; font-weight: 800; }
        .c-info p { font-size: 12px; color: #64748b; font-weight: 600; }

        .follow-btn {
            background: var(--primary); color: white; padding: 12px 25px;
            border-radius: 16px; font-size: 14px; font-weight: 800; border: none; cursor: pointer;
            transition: var(--transition);
        }
        .follow-btn.active { background: #cbd5e1; color: #000; }

        /* Description */
        .description-box {
            background: #f1f5f9; padding: 20px; border-radius: 20px;
            font-size: 14px; line-height: 1.6; color: #475569; margin-bottom: 40px;
        }

        /* Related Grid */
        .section-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; }
        .related-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .related-grid { grid-template-columns: 1fr 1fr; } }

        .rel-card { display: flex; gap: 15px; cursor: pointer; transition: var(--transition); }
        .rel-card:hover { transform: translateX(5px); }
        .rel-thumb { width: 150px; aspect-ratio: 16/9; border-radius: 15px; overflow: hidden; background: #000; flex-shrink: 0; }
        .rel-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .rel-meta h5 { font-size: 14px; font-weight: 700; margin-bottom: 5px; line-height: 1.4; }
        .rel-meta p { font-size: 12px; color: #64748b; font-weight: 600; }

        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <header class="player-header">
        <div class="back-circle" onclick="history.back()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </div>
        <span style="font-weight: 900; font-size: 18px; letter-spacing: -1px;">ELITE CINEMA</span>
        <div style="width:45px;"></div>
    </header>

    <div class="video-stage">
        <!-- Main Video -->
        <video id="mainVideo" controls autoplay playsinline controlsList="nodownload"></video>
        
        <!-- Status/Error Overlay -->
        <div id="statusOverlay">
            <div class="loader-ring"></div>
            <h3 style="font-weight: 800;">Elite Sync in Progress</h3>
            <p style="opacity: 0.7; font-size: 13px; margin-top: 5px;">The content link is being optimized for 4K streaming.</p>
        </div>
    </div>

    <main class="content-wrap">
        <h1 class="v-title" id="vTitle">...</h1>
        <div class="v-stats" id="vMeta">Elite Processing • 0 Views</div>

        <!-- Interactions -->
        <div class="actions-row">
            <div class="btn-pill" id="likeBtn" onclick="handleLike()">
                <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
                <span id="likeText">Luxury Like</span>
            </div>
            <div class="btn-pill" onclick="handleShare()">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
                <span>Elite Share</span>
            </div>
            <div class="btn-pill">
                <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                <span>Save Elite</span>
            </div>
        </div>

        <!-- Creator -->
        <div class="creator-card">
            <div class="c-profile">
                <div class="c-avatar" id="cAvatar">U</div>
                <div class="c-info">
                    <h4 id="cName">...</h4>
                    <p>Verified Elite Member</p>
                </div>
            </div>
            <button class="follow-btn" id="followBtn" onclick="handleFollow()">Elite Follow</button>
        </div>

        <!-- Description -->
        <div class="description-box" id="vDesc">...</div>

        <!-- Related Feed -->
        <h3 class="section-title">Next for You</h3>
        <div class="related-grid" id="relatedGrid">
            <!-- Items via JS -->
        </div>

    </main>

    <script type="module">
        import { doc, getDoc, collection, query, limit, getDocs, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { db } from "./imp/firebase-config.js";

        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        const mainVid = document.getElementById('mainVideo');
        const overlay = document.getElementById('statusOverlay');

        if (!videoId) window.location.href = 'home.html';

        async function initElitePlayer() {
            try {
                const snap = await getDoc(doc(db, "videos", videoId));
                if (snap.exists()) {
                    const data = snap.data();

                    // Update UI
                    document.getElementById('vTitle').innerText = data.title;
                    document.getElementById('vDesc').innerText = data.description || "This luxury content is verified and secured by Nexy Hub Elite Protocols.";
                    document.getElementById('vMeta').innerText = `${data.views || 0} Elite Views • Live Streaming`;
                    document.getElementById('cName').innerText = data.username;
                    document.getElementById('cAvatar').innerText = data.username.charAt(0).toUpperCase();

                    // Video Playback Logic
                    mainVid.src = data.videoURL;
                    
                    // If video actually starts playing, hide the overlay
                    mainVid.onplaying = () => {
                        overlay.style.display = 'none';
                    };

                    // If video fails (fake link), show the luxury placeholder instead of standard error
                    mainVid.onerror = () => {
                        console.log("Fake or Broken Link Detected. Staying on luxury placeholder.");
                        mainVid.style.display = 'none';
                        overlay.querySelector('.loader-ring').style.display = 'none';
                        overlay.querySelector('h3').innerText = "Elite Sync Interrupted";
                        overlay.querySelector('p').innerText = "The video link is moved or currently in processing state.";
                    };

                    // Views count
                    updateDoc(doc(db, "videos", videoId), { views: increment(1) });
                    
                    loadRelated();
                }
            } catch (e) { console.error(e); }
        }

        async function loadRelated() {
            const grid = document.getElementById('relatedGrid');
            const q = query(collection(db, "videos"), limit(6));
            const snap = await getDocs(q);
            snap.forEach(doc => {
                if (doc.id === videoId) return;
                const d = doc.data();
                const el = document.createElement('div');
                el.className = 'rel-card';
                el.onclick = () => window.location.href = `video-player.html?v=${doc.id}`;
                el.innerHTML = `
                    <div class="rel-thumb"><img src="${d.thumbnail || 'https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=300'}"></div>
                    <div class="rel-meta">
                        <h5>${d.title}</h5>
                        <p>${d.username}</p>
                    </div>
                `;
                grid.appendChild(el);
            });
        }

        window.handleLike = () => {
            const btn = document.getElementById('likeBtn');
            btn.classList.toggle('active');
            document.getElementById('likeText').innerText = btn.classList.contains('active') ? "Elite Liked" : "Luxury Like";
        };

        window.handleFollow = () => {
            const btn = document.getElementById('followBtn');
            btn.classList.toggle('active');
            btn.innerText = btn.classList.contains('active') ? "Following" : "Elite Follow";
        };

        window.handleShare = () => {
            if (navigator.share) {
                navigator.share({ title: 'Nexy Elite Cinema', url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Elite link copied to clipboard.");
            }
        };

        initElitePlayer();
    </script>
</body>
</html>
