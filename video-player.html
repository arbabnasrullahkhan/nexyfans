<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Cinema - Nexy Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --accent: #6366f1;
            --bg: #ffffff;
            --card: #f8fafc;
            --border: #e2e8f0;
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #0f172a;
            overflow-x: hidden;
        }

        /* --- LUXURY STICKY NAV --- */
        .player-nav {
            position: sticky; top: 0; width: 100%; height: 70px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(25px);
            display: flex; align-items: center; padding: 0 20px;
            z-index: 1000; border-bottom: 1.5px solid var(--border);
        }

        .back-circle {
            width: 45px; height: 45px; border-radius: 50%; background: #fff;
            display: flex; justify-content: center; align-items: center;
            border: 1.5px solid var(--border); cursor: pointer; transition: var(--transition);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .back-circle:active { transform: scale(0.9); }

        /* --- ELITE VIDEO STAGE --- */
        .video-stage {
            width: 100%; background: #000; position: relative;
            aspect-ratio: 16/9; display: flex; justify-content: center; align-items: center;
            overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        video { width: 100%; height: 100%; object-fit: contain; display: block; }

        /* Luxury Buffering Loader */
        .video-loader {
            position: absolute; display: flex; flex-direction: column; align-items: center; gap: 15px;
            color: white; z-index: 10;
        }
        .spinner-ring {
            width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #fff; border-radius: 50%; animation: spin 1s linear infinite;
        }

        /* Error Overlay */
        #errorOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; flex-direction: column;
            justify-content: center; align-items: center; color: #fff; text-align: center;
            padding: 30px; z-index: 20;
        }

        /* --- CONTENT AREA --- */
        .content-wrap { padding: 25px 20px; max-width: 1000px; margin: 0 auto; }

        .v-title { font-size: 24px; font-weight: 800; line-height: 1.3; margin-bottom: 12px; letter-spacing: -0.8px; }
        .v-meta { font-size: 13px; color: #64748b; font-weight: 700; margin-bottom: 25px; display: flex; gap: 12px; }

        .creator-card {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px; background: var(--card); border-radius: 25px;
            border: 1.5px solid var(--border); margin-bottom: 30px;
        }
        .c-profile { display: flex; align-items: center; gap: 15px; }
        .c-avatar { width: 50px; height: 50px; border-radius: 50%; background: #000; color: #fff;
                    display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 18px; }
        
        .follow-btn {
            background: var(--primary); color: white; padding: 12px 28px;
            border-radius: 16px; font-size: 14px; font-weight: 800; border: none; cursor: pointer;
        }

        .desc-box { 
            font-size: 15px; line-height: 1.7; color: #475569; padding: 20px;
            background: #f8fafc; border-radius: 20px; margin-bottom: 40px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* No-Download Shield */
        video::-internal-media-controls-download-button { display:none; }
        video::-webkit-media-controls-enclosure { display:none !important; }

    </style>
</head>
<body>

    <nav class="player-nav">
        <div class="back-circle" onclick="history.back()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </div>
        <span style="font-weight: 900; margin-left: 15px; letter-spacing: -1px; font-size: 20px;">NEXY CINEMA</span>
    </nav>

    <div class="video-stage">
        <!-- Loader: Hidden when video starts -->
        <div class="video-loader" id="vLoader">
            <div class="spinner-ring"></div>
            <p style="font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">Elite Syncing...</p>
        </div>

        <video id="mainVideo" playsinline controls controlsList="nodownload" preload="auto"></video>

        <!-- Error UI -->
        <div id="errorOverlay">
            <svg width="50" height="50" fill="#ef4444" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            <h2 style="margin-top:20px; font-weight:800;">Connection Interrupted</h2>
            <p style="font-size:14px; opacity:0.7; margin-top:10px;">The elite video link has moved or is currently processing.</p>
            <button onclick="location.reload()" style="margin-top:25px; padding:15px 35px; border-radius:15px; border:none; background:#fff; color:#000; font-weight:800; cursor:pointer;">Retry Elite Sync</button>
        </div>
    </div>

    <main class="content-wrap">
        <h1 class="v-title" id="vTitle">...</h1>
        <div class="v-meta" id="vMeta">0 Views • Elite Member Content</div>

        <div class="creator-card">
            <div class="c-profile">
                <div class="c-avatar" id="cAvatar">?</div>
                <div>
                    <h4 id="cName" style="font-size:16px; font-weight:800;">Elite Creator</h4>
                    <p style="font-size:12px; color:#64748b; font-weight:600;">Verified Member</p>
                </div>
            </div>
            <button class="follow-btn">Elite Follow</button>
        </div>

        <div class="desc-box" id="vDesc">
            Loading luxury description...
        </div>
    </main>

    <script type="module">
        import { doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { db } from "./imp/firebase-config.js";

        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        const mainVid = document.getElementById('mainVideo');
        const vLoader = document.getElementById('vLoader');
        const errorUI = document.getElementById('errorOverlay');

        if (!videoId) window.location.href = 'home.html';

        async function initElitePlayer() {
            try {
                const snap = await getDoc(doc(db, "videos", videoId));
                if (snap.exists()) {
                    const data = snap.data();
                    
                    // 1. Set Video Source
                    mainVid.src = data.videoURL;
                    
                    // 2. Setup Listeners
                    mainVid.oncanplay = () => {
                        vLoader.style.display = 'none';
                        mainVid.play().catch(e => console.log("Autoplay blocked, waiting for interaction."));
                    };

                    mainVid.onerror = () => {
                        vLoader.style.display = 'none';
                        errorUI.style.display = 'flex';
                    };

                    // 3. Update Text UI
                    document.getElementById('vTitle').innerText = data.title;
                    document.getElementById('vDesc').innerText = data.description || "This luxury experience was shared by an elite member of Nexy Hub.";
                    document.getElementById('vMeta').innerText = `${data.views || 0} Views • Published on Nexy Hub`;
                    document.getElementById('cName').innerText = data.username;
                    document.getElementById('cAvatar').innerText = data.username.charAt(0).toUpperCase();

                    // 4. Update Stats in Background
                    updateDoc(doc(db, "videos", videoId), { views: increment(1) });

                } else {
                    window.location.href = 'home.html';
                }
            } catch (e) {
                console.error(e);
                vLoader.style.display = 'none';
                errorUI.style.display = 'flex';
            }
        }

        // Run Player
        initElitePlayer();

        // Extra: Force hide global loader if stuck
        setTimeout(() => {
            const gl = document.getElementById('nexy-loader-wrapper');
            if(gl) gl.style.display = 'none';
        }, 3000);
    </script>
</body>
</html>
