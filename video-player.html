<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexy Cinema - Luxury Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #000; --bg: #ffffff; --card: #f1f5f9; --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); overflow-x: hidden; }
        .player-nav { position: sticky; top: 0; width: 100%; height: 60px; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); display: flex; align-items: center; padding: 0 20px; z-index: 1000; border-bottom: 1px solid #e2e8f0; }
        .video-stage { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; justify-content: center; align-items: center; position: relative; }
        #mainVideo { width: 100%; height: 100%; }
        .content-info { padding: 20px; max-width: 800px; margin: 0 auto; }
        .v-title { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
        .v-stats { font-size: 13px; color: #64748b; font-weight: 600; margin-bottom: 20px; }
        .creator-bar { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; margin-bottom: 20px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; font-weight: 800; }
        .desc-box { background: #f8fafc; padding: 20px; border-radius: 20px; font-size: 14px; line-height: 1.6; color: #334155; }
        #errorMsg { position: absolute; color: white; display: none; font-weight: 700; text-align: center; }
    </style>
</head>
<body>
    <nav class="player-nav">
        <button onclick="history.back()" style="background:none; border:none; font-weight:800; cursor:pointer;">← Back</button>
        <span style="margin-left: 15px; font-weight: 900; letter-spacing: -0.5px;">NEXY CINEMA</span>
    </nav>

    <div class="video-stage">
        <video id="mainVideo" controls autoplay playsinline controlsList="nodownload"></video>
        <div id="errorMsg">Video Link Expired or Private</div>
    </div>

    <main class="content-info">
        <h1 class="v-title" id="vTitle">Loading...</h1>
        <p class="v-stats" id="vStats">0 views • Processing</p>

        <div class="creator-bar">
            <div style="display:flex; align-items:center; gap:12px;">
                <div class="avatar" id="cAvatar">U</div>
                <div>
                    <h4 id="cName" style="font-size:15px; font-weight:800;">Elite Member</h4>
                    <p style="font-size:12px; color:#64748b;">Verified</p>
                </div>
            </div>
            <button style="background:#000; color:#fff; border:none; padding:10px 20px; border-radius:12px; font-weight:800; cursor:pointer;">Follow</button>
        </div>

        <div class="desc-box" id="vDesc">...</div>
    </main>

    <script type="module">
        import { doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { db } from "./imp/firebase-config.js";

        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        const mainVid = document.getElementById('mainVideo');

        if (!videoId) window.location.href = 'home.html';

        async function loadVideo() {
            try {
                const snap = await getDoc(doc(db, "videos", videoId));
                if (snap.exists()) {
                    const data = snap.data();
                    mainVid.src = data.videoURL;
                    document.getElementById('vTitle').innerText = data.title;
                    document.getElementById('vDesc').innerText = data.description || "Premium elite content.";
                    document.getElementById('vStats').innerText = `${data.views || 0} views • Elite Live`;
                    document.getElementById('cName').innerText = data.username;
                    document.getElementById('cAvatar').innerText = data.username.charAt(0).toUpperCase();

                    // Error handling if video link fails
                    mainVid.onerror = () => {
                        mainVid.style.display = 'none';
                        document.getElementById('errorMsg').style.display = 'block';
                    };

                    // Views increment
                    updateDoc(doc(db, "videos", videoId), { views: increment(1) });
                }
            } catch (e) { console.error(e); }
        }
        loadVideo();
    </script>
</body>
</html>
