<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Cinema - Nexy Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #000; --bg: #ffffff; --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); }
        .player-nav { position: sticky; top: 0; width: 100%; height: 65px; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); display: flex; align-items: center; padding: 0 20px; z-index: 1000; border-bottom: 1px solid #e2e8f0; }
        .back-btn { background: #f1f5f9; border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 1px solid #e2e8f0; }
        .video-stage { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; justify-content: center; align-items: center; position: relative; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .info-card { padding: 25px 20px; max-width: 900px; margin: 0 auto; }
        .v-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
        .v-meta { font-size: 13px; color: #64748b; font-weight: 600; margin-bottom: 20px; }
        .creator-bar { display: flex; align-items: center; gap: 15px; padding: 15px; background: #f8fafc; border-radius: 20px; margin-bottom: 20px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; font-weight: 800; }
        #errorOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; }
    </style>
</head>
<body>
    <nav class="player-nav">
        <div class="back-btn" onclick="history.back()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></div>
        <span style="font-weight: 900; margin-left: 15px;">NEXY CINEMA</span>
    </nav>

    <div class="video-stage">
        <video id="mainVideo" controls autoplay playsinline preload="auto"></video>
        <div id="errorOverlay">
            <h3>Elite Link Expired</h3>
            <p style="font-size:12px; opacity:0.7;">This secure link has been viewed or timed out.</p>
            <button onclick="location.reload()" style="margin-top:15px; padding:10px 20px; border-radius:10px; border:none; font-weight:800; cursor:pointer;">Retry</button>
        </div>
    </div>

    <main class="info-card">
        <h1 class="v-title" id="vTitle">...</h1>
        <p class="v-meta" id="vMeta">0 views • Elite Hub</p>
        <div class="creator-bar">
            <div class="avatar" id="cAvatar">?</div>
            <div>
                <h4 id="cName" style="font-size:15px; font-weight:800;">Creator</h4>
                <p style="font-size:12px; color:#64748b;">Verified Hub Member</p>
            </div>
        </div>
        <div id="vDesc" style="font-size:14px; color:#475569; line-height:1.6; background:#f1f5f9; padding:15px; border-radius:15px;">...</div>
    </main>

    <script type="module">
        import { doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { db } from "./imp/firebase-config.js";

        const videoId = new URLSearchParams(window.location.search).get('v');
        const mainVid = document.getElementById('mainVideo');

        if (!videoId) window.location.href = 'home.html';

        async function loadEliteVideo() {
            const snap = await getDoc(doc(db, "videos", videoId));
            if (snap.exists()) {
                const data = snap.data();
                mainVid.src = data.videoURL;
                document.getElementById('vTitle').innerText = data.title;
                document.getElementById('vMeta').innerText = `${data.views || 0} Views • Elite Quality`;
                document.getElementById('cName').innerText = data.username;
                document.getElementById('cAvatar').innerText = data.username.charAt(0).toUpperCase();
                document.getElementById('vDesc').innerText = data.description || "Experience the best on Nexy Hub.";

                mainVid.onerror = () => document.getElementById('errorOverlay').style.display = 'flex';
                updateDoc(doc(db, "videos", videoId), { views: increment(1) });
            }
        }
        loadEliteVideo();
    </script>
</body>
</html>
