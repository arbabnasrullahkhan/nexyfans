<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Settings - Nexy Fans</title>
    <meta name="theme-color" content="#ffffff">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Base Styles & Theme Variables */
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-sub: #64748b;
            --border-color: #f1f5f9;
            --accent: #1a1a1a;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --accent: #38bdf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.3s ease;
            min-height: 100vh;
        }

        /* Top Header */
        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 900;
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
        }

        /* Main Layout */
        .main-layout {
            padding-top: 80px;
            padding-bottom: 100px;
            max-width: 600px;
            margin: 0 auto;
            padding-left: 16px;
            padding-right: 16px;
        }

        @media (min-width: 768px) {
            body { padding-left: 80px; }
        }

        /* Settings Group (iOS Style) */
        .settings-group {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .group-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            margin: 0 0 8px 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }

        .settings-item:last-child { border-bottom: none; }
        .settings-item:active { background: var(--border-color); }

        .item-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-box {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-box svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        .item-label {
            font-size: 15px;
            font-weight: 500;
        }

        .item-right {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-sub);
            font-size: 14px;
        }

        /* Input Styles */
        .settings-input {
            background: transparent;
            border: none;
            text-align: right;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            width: 150px;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Save Button */
        .save-btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            background: var(--accent);
            color: white;
            border: none;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            display: none; /* Only show when changes made */
        }

        .danger-text { color: #ef4444 !important; }
    </style>
</head>
<body data-theme="light">

    <div id="navDockContainer"></div>

    <header class="top-header">Settings</header>

    <main class="main-layout">
        
        <!-- Profile Settings -->
        <p class="group-title">Personal Information</p>
        <div class="settings-group">
            <div class="settings-item">
                <div class="item-left">
                    <div class="icon-box" style="background: #3b82f6;">
                        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </div>
                    <span class="item-label">Display Name</span>
                </div>
                <div class="item-right">
                    <input type="text" id="setDisplayName" class="settings-input" placeholder="Loading...">
                </div>
            </div>
            <div class="settings-item">
                <div class="item-left">
                    <div class="icon-box" style="background: #10b981;">
                        <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                    </div>
                    <span class="item-label">Phone</span>
                </div>
                <div class="item-right">
                    <input type="tel" id="setPhone" class="settings-input" placeholder="Not set">
                </div>
            </div>
        </div>

        <button id="saveBtn" class="save-btn">Save Changes</button>

        <!-- Preferences -->
        <p class="group-title">Preferences</p>
        <div class="settings-group">
            <div class="settings-item">
                <div class="item-left">
                    <div class="icon-box" style="background: #1e293b;">
                        <svg viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z"/></svg>
                    </div>
                    <span class="item-label">Dark Mode</span>
                </div>
                <div class="item-right">
                    <label class="switch">
                        <input type="checkbox" id="themeToggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Info & Legal -->
        <p class="group-title">Support & Legal</p>
        <div class="settings-group">
            <div class="settings-item" onclick="window.location.href='help.html'">
                <div class="item-left">
                    <div class="icon-box" style="background: #f59e0b;">
                        <svg viewBox="0 0 24 24"><path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/></svg>
                    </div>
                    <span class="item-label">Help & Support</span>
                </div>
                <div class="item-right">❯</div>
            </div>
            <div class="settings-item" onclick="window.location.href='privacy.html'">
                <div class="item-left">
                    <div class="icon-box" style="background: #6366f1;">
                        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                    </div>
                    <span class="item-label">Privacy Policy</span>
                </div>
                <div class="item-right">❯</div>
            </div>
        </div>

        <!-- Account -->
        <p class="group-title">Account Actions</p>
        <div class="settings-group">
            <div class="settings-item" id="logoutBtn">
                <div class="item-left">
                    <div class="icon-box" style="background: #ef4444;">
                        <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                    </div>
                    <span class="item-label danger-text">Log Out</span>
                </div>
            </div>
        </div>

    </main>

    <!-- Firebase & Logic -->
    <script type="module">
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db } from "./imp/firebase-config.js";

        let currentUid = null;

        // 1. Auth Check
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.replace("login.html");
            } else {
                currentUid = user.uid;
                loadSettings(user.uid);
            }
        });

        // 2. Load Nav Dock
        async function loadNavDock() {
            try {
                const response = await fetch('./imp/nav-dock-button.html');
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById('navDockContainer').innerHTML = html;
                    const scripts = document.getElementById('navDockContainer').getElementsByTagName('script');
                    for (let script of scripts) eval(script.innerText);
                }
            } catch (e) {}
        }
        loadNavDock();

        // 3. Load User Data
        async function loadSettings(uid) {
            const userDoc = await getDoc(doc(db, "users", uid));
            if (userDoc.exists()) {
                const data = userDoc.data();
                document.getElementById('setDisplayName').value = data.username || "";
                document.getElementById('setPhone').value = data.phone || "";
            }
        }

        // 4. Handle Save
        const saveBtn = document.getElementById('saveBtn');
        const inputs = document.querySelectorAll('.settings-input');

        inputs.forEach(input => {
            input.addEventListener('input', () => {
                saveBtn.style.display = 'block';
            });
        });

        saveBtn.addEventListener('click', async () => {
            if (!currentUid) return;
            saveBtn.innerText = "Saving...";
            saveBtn.disabled = true;

            try {
                const userRef = doc(db, "users", currentUid);
                await updateDoc(userRef, {
                    username: document.getElementById('setDisplayName').value,
                    phone: document.getElementById('setPhone').value
                });
                alert("Settings saved!");
                saveBtn.style.display = 'none';
            } catch (e) {
                alert("Error saving settings.");
            } finally {
                saveBtn.innerText = "Save Changes";
                saveBtn.disabled = false;
            }
        });

        // 5. Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('nexy-theme') || 'light';
        
        document.body.setAttribute('data-theme', savedTheme);
        themeToggle.checked = (savedTheme === 'dark');

        themeToggle.addEventListener('change', () => {
            const theme = themeToggle.checked ? 'dark' : 'light';
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('nexy-theme', theme);
        });

        // 6. Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if(confirm("Log out of Nexy Fans?")) {
                signOut(auth).then(() => window.location.replace('index.html'));
            }
        });
    </script>
</body>
</html>
