<!-- imp/warning.html -->
<style>
    /* Popup Overlay */
    #nexy-popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 11000;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        padding: 24px;
    }

    #nexy-popup-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    /* Modal Box */
    .nexy-modal {
        background: #ffffff;
        width: 100%;
        max-width: 340px;
        border-radius: 28px;
        padding: 30px 24px;
        text-align: center;
        transform: scale(0.8) translateY(20px);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    #nexy-popup-overlay.active .nexy-modal {
        transform: scale(1) translateY(0);
    }

    /* Icons */
    .modal-icon {
        width: 64px;
        height: 64px;
        border-radius: 22px;
        margin: 0 auto 20px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .modal-icon svg {
        width: 32px;
        height: 32px;
    }

    /* Icon Variations */
    .icon-success { background: #ecfdf5; }
    .icon-success svg { fill: #10b981; }

    .icon-error { background: #fef2f2; }
    .icon-error svg { fill: #ef4444; }

    .icon-warning { background: #fffbeb; }
    .icon-warning svg { fill: #f59e0b; }

    .icon-info { background: #f1f5f9; }
    .icon-info svg { fill: #1a1a1a; }

    /* Text */
    .modal-title {
        font-size: 19px;
        font-weight: 700;
        color: #1a1a1a;
        margin-bottom: 10px;
    }

    .modal-message {
        font-size: 14px;
        color: #64748b;
        line-height: 1.6;
        margin-bottom: 24px;
    }

    /* Buttons */
    .modal-btn {
        width: 100%;
        padding: 14px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
    }

    .btn-main {
        background: #1a1a1a;
        color: #ffffff;
        margin-bottom: 10px;
    }

    .btn-main:active { transform: scale(0.96); }

    .btn-secondary {
        background: transparent;
        color: #64748b;
    }
</style>

<div id="nexy-popup-overlay">
    <div class="nexy-modal">
        <div class="modal-icon" id="modalIcon">
            <!-- SVG injected by JS -->
        </div>
        <h2 class="modal-title" id="modalTitle">Alert</h2>
        <p class="modal-message" id="modalMessage">Something went wrong.</p>
        
        <button class="modal-btn btn-main" id="modalConfirmBtn">Understand</button>
        <button class="modal-btn btn-secondary" id="modalCancelBtn" style="display: none;">Cancel</button>
    </div>
</div>

<script>
    (function() {
        const overlay = document.getElementById('nexy-popup-overlay');
        const iconContainer = document.getElementById('modalIcon');
        const titleEl = document.getElementById('modalTitle');
        const msgEl = document.getElementById('modalMessage');
        const confirmBtn = document.getElementById('modalConfirmBtn');
        const cancelBtn = document.getElementById('modalCancelBtn');

        const icons = {
            success: `<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`,
            error: `<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12z"/></svg>`,
            warning: `<svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>`,
            info: `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>`
        };

        // Define Global Show Function
        window.NexyShowPopup = function(options) {
            const { 
                type = 'info', 
                title = 'Notice', 
                message = '', 
                confirmText = 'Understand',
                showCancel = false,
                onConfirm = () => {} 
            } = options;

            // Set Content
            titleEl.innerText = title;
            msgEl.innerText = message;
            confirmBtn.innerText = confirmText;
            iconContainer.className = `modal-icon icon-${type}`;
            iconContainer.innerHTML = icons[type];
            
            cancelBtn.style.display = showCancel ? 'block' : 'none';

            // Show
            overlay.classList.add('active');

            // Click Handler
            confirmBtn.onclick = () => {
                overlay.classList.remove('active');
                onConfirm();
            };

            cancelBtn.onclick = () => {
                overlay.classList.remove('active');
            };
        };
    })();
</script>
