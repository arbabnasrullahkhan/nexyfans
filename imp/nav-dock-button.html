<!-- imp/nav-dock-button.html -->
<style>
    /* Responsive Navigation Dock (Mobile Bottom / Desktop Sidebar) */
    
    .nav-dock {
        position: fixed;
        z-index: 999;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.04);
        display: flex;
        font-family: 'Inter', sans-serif;
        transition: all 0.3s ease;
    }

    /* Mobile First: Bottom Navigation */
    @media (max-width: 767px) {
        .nav-dock {
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding-bottom: env(safe-area-inset-bottom); /* iOS safe area */
        }
    }

    /* Desktop: Left Sidebar */
    @media (min-width: 768px) {
        .nav-dock {
            top: 0;
            left: 0;
            width: 80px;
            height: 100vh;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.02);
            gap: 40px;
        }
    }

    /* Navigation Items */
    .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: #94a3b8;
        transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        width: 60px;
        height: 60px;
        border-radius: 16px;
        position: relative;
    }

    .nav-item:active {
        transform: scale(0.9);
    }

    .nav-item svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
        transition: all 0.3s ease;
    }

    .nav-item .nav-label {
        font-size: 10px;
        font-weight: 600;
        margin-top: 4px;
        opacity: 0;
        transform: translateY(5px);
        transition: all 0.3s ease;
        position: absolute;
        bottom: 6px;
    }

    /* Active State */
    .nav-item.active {
        color: #1a1a1a;
    }

    .nav-item.active svg {
        transform: translateY(-8px);
    }

    .nav-item.active .nav-label {
        opacity: 1;
        transform: translateY(0);
    }

    @media (min-width: 768px) {
        .nav-item.active svg {
            transform: translateY(0);
        }
        .nav-item .nav-label {
            display: none; /* Hide labels on desktop mini sidebar */
        }
    }

    /* Prominent Upload Button (Middle) */
    .nav-item-upload {
        background: linear-gradient(135deg, #1a1a1a 0%, #4a4a4a 100%);
        color: #ffffff;
        border-radius: 20px;
        width: 50px;
        height: 50px;
        box-shadow: 0 8px 16px rgba(26, 26, 26, 0.2);
    }

    @media (min-width: 768px) {
        .nav-item-upload {
            margin: 20px 0;
        }
    }

    .nav-item-upload svg {
        fill: #ffffff;
        width: 24px;
        height: 24px;
    }

    .nav-item-upload.active {
        color: #ffffff;
    }

    .nav-item-upload.active svg {
        transform: translateY(0); /* Override active shift for upload */
    }
</style>

<nav class="nav-dock" id="bottomNavDock">
    <!-- Home -->
    <a href="home.html" class="nav-item" data-page="home">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3L4 9V21H9V14H15V21H20V9L12 3Z"/>
        </svg>
        <span class="nav-label">Home</span>
    </a>

    <!-- Reels -->
    <a href="reel.html" class="nav-item" data-page="reel">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M17 10.5V7C17 6.44772 16.5523 6 16 6H4C3.44772 6 3 6.44772 3 7V17C3 17.5523 3.44772 18 4 18H16C16.5523 18 17 17.5523 17 17V13.5L21 17.5V6.5L17 10.5Z"/>
        </svg>
        <span class="nav-label">Reels</span>
    </a>

    <!-- Upload (FAB Style) -->
    <a href="upload.html" class="nav-item nav-item-upload" data-page="upload">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M11 11V5H13V11H19V13H13V19H11V13H5V11H11Z"/>
        </svg>
    </a>

    <!-- Chat -->
    <a href="chat.html" class="nav-item" data-page="chat">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2ZM20 16H5.17L4 17.17V4H20V16Z"/>
        </svg>
        <span class="nav-label">Chat</span>
    </a>

    <!-- Profile -->
    <a href="profile.html" class="nav-item" data-page="profile">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z"/>
        </svg>
        <span class="nav-label">Profile</span>
    </a>
</nav>

<script>
    // Self-executing script to automatically highlight the active tab
    (function() {
        // Get the current filename from the URL (e.g., "home.html")
        const path = window.location.pathname;
        const pageName = path.split('/').pop().split('.')[0] || "home"; 

        // Find all navigation items
        const navItems = document.querySelectorAll('#bottomNavDock .nav-item');
        
        navItems.forEach(item => {
            // Check if the data-page attribute matches the current page
            if (item.getAttribute('data-page') === pageName) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });
    })();
</script>
