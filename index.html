<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexy Fans</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #ffffff;
            --accent: #000000;
            --font: 'Plus Jakarta Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Abstract Premium Background */
        .mesh-gradient {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 0% 0%, #f3f4f6 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, #e5e7eb 0%, transparent 50%);
            filter: blur(60px);
        }

        .splash-content {
            position: relative;
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Animated Luxury Logo */
        .logo-wrap {
            width: 90px;
            height: 90px;
            background: var(--accent);
            border-radius: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            animation: logoAppear 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .logo-wrap svg {
            width: 45px;
            height: 45px;
            fill: #fff;
            animation: iconRotate 3s infinite ease-in-out;
        }

        .app-name {
            margin-top: 24px;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            opacity: 0;
            transform: translateY(10px);
            animation: textFadeUp 0.8s 0.5s ease-out forwards;
        }

        /* Loader Bar */
        .loader-track {
            width: 120px;
            height: 4px;
            background: #e5e7eb;
            border-radius: 10px;
            margin-top: 30px;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.5s 0.8s forwards;
        }

        .loader-fill {
            width: 0%;
            height: 100%;
            background: var(--accent);
            animation: fillProgress 2s ease-in-out forwards;
        }

        @keyframes logoAppear {
            0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes textFadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fillProgress {
            to { width: 100%; }
        }

        @keyframes fadeIn { to { opacity: 1; } }

        .fade-out {
            animation: fadeOutScreen 0.6s forwards;
        }

        @keyframes fadeOutScreen {
            to { opacity: 0; transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="mesh-gradient"></div>

    <div class="splash-content" id="splash">
        <div class="logo-wrap">
            <svg viewBox="0 0 24 24"><path d="M8 5.14V18.86C8 19.75 8.97 20.29 9.72 19.82L20.59 13.06C21.28 12.63 21.28 11.64 20.59 11.21L9.72 4.45C8.97 3.98 8 4.52 8 5.14Z"/></svg>
        </div>
        <h1 class="app-name">Nexy Hub</h1>
        <div class="loader-track">
            <div class="loader-fill"></div>
        </div>
    </div>

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { auth } from "./imp/firebase-config.js";

        const MIN_TIME = 2500;
        const start = Date.now();

        onAuthStateChanged(auth, (user) => {
            const diff = Date.now() - start;
            const delay = Math.max(0, MIN_TIME - diff);

            setTimeout(() => {
                document.body.classList.add('fade-out');
                setTimeout(() => {
                    if (user) {
                        window.location.replace("home.html");
                    } else {
                        window.location.replace("welcome.html");
                    }
                }, 500);
            }, delay);
        });
    </script>
</body>
</html>
