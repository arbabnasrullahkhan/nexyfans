<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexy Hub</title>
    
    <!-- Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --bg: #ffffff;
            --text-main: #1a1a1a;
            --glass: rgba(255, 255, 255, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Luxury Mesh Background Blobs */
        .mesh-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: blur(100px);
            opacity: 0.6;
        }

        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            animation: move 10s infinite alternate;
        }

        .blob-1 { background: #e2e8f0; top: -50px; left: -50px; }
        .blob-2 { background: #cbd5e1; bottom: -50px; right: -50px; animation-delay: -5s; }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(50px, 100px) scale(1.2); }
        }

        /* Splash Container */
        .container {
            text-align: center;
            z-index: 10;
        }

        .logo-box {
            width: 100px;
            height: 100px;
            background: var(--primary);
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            transform: scale(0);
            animation: popIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .logo-box svg {
            width: 50px;
            height: 50px;
            fill: white;
        }

        .app-name {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -1.5px;
            color: var(--text-main);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.8s 0.3s ease-out forwards;
        }

        .status-text {
            margin-top: 12px;
            font-size: 14px;
            color: #94a3b8;
            font-weight: 500;
            opacity: 0;
            animation: fadeIn 0.5s 0.8s forwards;
        }

        /* Minimalist Shimmer Loader */
        .loader-bar {
            width: 140px;
            height: 4px;
            background: #f1f5f9;
            border-radius: 10px;
            margin: 30px auto 0;
            overflow: hidden;
            position: relative;
        }

        .loader-progress {
            width: 0%;
            height: 100%;
            background: var(--primary);
            border-radius: 10px;
            animation: loading 2.5s ease-in-out forwards;
        }

        /* Animations */
        @keyframes popIn {
            to { transform: scale(1); }
        }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        /* Exit Animation */
        .exit-screen {
            animation: exit 0.6s cubic-bezier(0.7, 0, 0.3, 1) forwards;
        }

        @keyframes exit {
            to { opacity: 0; transform: scale(1.1); filter: blur(20px); }
        }

        /* Offline Warning */
        #offline-notice {
            position: fixed;
            bottom: 40px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container" id="main-content">
        <div class="logo-box">
            <svg viewBox="0 0 24 24"><path d="M8 5.14V18.86C8 19.75 8.97 20.29 9.72 19.82L20.59 13.06C21.28 12.63 21.28 11.64 20.59 11.21L9.72 4.45C8.97 3.98 8 4.52 8 5.14Z"/></svg>
        </div>
        <h1 class="app-name">Nexy Hub</h1>
        <p class="status-text" id="status">Syncing luxury experience...</p>
        
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <div id="offline-notice">No internet connection. Waiting...</div>

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { auth } from "./imp/firebase-config.js";

        const statusEl = document.getElementById('status');
        const contentEl = document.getElementById('main-content');

        // Check Internet Connection
        function checkConnection() {
            if (!navigator.onLine) {
                document.getElementById('offline-notice').style.display = 'block';
                statusEl.innerText = "Connection lost...";
            } else {
                document.getElementById('offline-notice').style.display = 'none';
            }
        }

        window.addEventListener('online', checkConnection);
        window.addEventListener('offline', checkConnection);
        checkConnection();

        // Min loading time for visual quality
        const startTime = Date.now();
        const minDuration = 2800; 

        onAuthStateChanged(auth, (user) => {
            const timeElapsed = Date.now() - startTime;
            const remainingTime = Math.max(0, minDuration - timeElapsed);

            setTimeout(() => {
                contentEl.classList.add('exit-screen');
                
                setTimeout(() => {
                    if (user) {
                        window.location.replace("home.html");
                    } else {
                        window.location.replace("welcome.html");
                    }
                }, 600);
            }, remainingTime);
        });
    </script>
</body>
</html>
