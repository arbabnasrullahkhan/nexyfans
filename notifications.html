<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notifications - Nexy Fans</title>
    <meta name="theme-color" content="#ffffff">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #1a1a1a;
            min-height: 100vh;
        }

        /* Top Header */
        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 900;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
        }

        /* Main Layout */
        .main-layout {
            padding-top: 80px;
            padding-bottom: 100px;
            max-width: 600px;
            margin: 0 auto;
            padding-left: 16px;
            padding-right: 16px;
        }

        @media (min-width: 768px) {
            body { padding-left: 80px; }
        }

        /* Weekly Status Card */
        .status-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            display: none; /* Shown via JS */
            border-left: 5px solid #10b981;
        }

        .status-card.warning {
            border-left-color: #ef4444;
            background: #fffafa;
        }

        .status-card h3 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .status-card p {
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
        }

        .status-card .days-left {
            display: inline-block;
            margin-top: 10px;
            font-weight: 700;
            color: #ef4444;
        }

        /* Notification List */
        .notif-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .notif-item {
            background: #ffffff;
            padding: 16px;
            border-radius: 16px;
            display: flex;
            gap: 16px;
            align-items: flex-start;
            transition: transform 0.2s;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .notif-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .icon-like { background: #fef2f2; }
        .icon-system { background: #f1f5f9; }
        .icon-chat { background: #ecfdf5; }

        .notif-icon svg {
            width: 20px;
            height: 20px;
        }

        .notif-content {
            flex: 1;
        }

        .notif-text {
            font-size: 14px;
            line-height: 1.4;
            color: #1f2937;
        }

        .notif-text b {
            font-weight: 600;
        }

        .notif-time {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 6px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            display: none;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            fill: #e2e8f0;
            margin-bottom: 16px;
        }

        .empty-state h2 {
            font-size: 18px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div id="navDockContainer"></div>

    <header class="top-header">
        <span class="header-title">Activity</span>
    </header>

    <main class="main-layout">
        
        <!-- Weekly Upload Status Card -->
        <div id="uploadStatusCard" class="status-card">
            <h3 id="statusTitle">All Good! ✅</h3>
            <p id="statusDesc">You are active. Keep sharing your videos to maintain your streak.</p>
            <div id="daysLeftMsg" class="days-left"></div>
        </div>

        <!-- Notifications Container -->
        <div id="notifList" class="notif-list">
            <!-- Items injected here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state">
            <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
            <h2>No new notifications</h2>
        </div>

    </main>

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db } from "./imp/firebase-config.js";

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.replace("login.html");
            } else {
                checkWeeklyRule(user.uid);
                fetchNotifications(user.uid);
            }
        });

        // 1. Inject Nav Dock
        async function loadNavDock() {
            try {
                const response = await fetch('./imp/nav-dock-button.html');
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById('navDockContainer').innerHTML = html;
                    const scripts = document.getElementById('navDockContainer').getElementsByTagName('script');
                    for (let script of scripts) eval(script.innerText);
                }
            } catch (e) {}
        }
        loadNavDock();

        // 2. Check Weekly Upload Rule Logic
        async function checkWeeklyRule(uid) {
            const statusCard = document.getElementById('uploadStatusCard');
            const title = document.getElementById('statusTitle');
            const desc = document.getElementById('statusDesc');
            const daysMsg = document.getElementById('daysLeftMsg');

            const userDoc = await getDoc(doc(db, "users", uid));
            if (!userDoc.exists()) return;

            const userData = userDoc.data();
            const lastUpload = userData.lastUploadDate ? userData.lastUploadDate.toDate() : userData.createdAt.toDate();
            
            const now = new Date();
            const diffTime = Math.abs(now - lastUpload);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const daysRemaining = 7 - diffDays;

            statusCard.style.display = 'block';

            if (daysRemaining <= 2) {
                statusCard.classList.add('warning');
                title.innerText = "Upload Required! ⚠️";
                desc.innerText = "To keep your account active, you must upload at least one video every 7 days.";
                daysMsg.innerText = daysRemaining <= 0 ? "Account at risk of suspension!" : `Only ${daysRemaining} days left!`;
            } else {
                daysMsg.innerText = `${daysRemaining} days until next required upload.`;
            }
        }

        // 3. Fetch Notifications from Firestore
        async function fetchNotifications(uid) {
            const list = document.getElementById('notifList');
            const empty = document.getElementById('emptyState');

            try {
                const q = query(
                    collection(db, "notifications"), 
                    where("userId", "==", uid), 
                    orderBy("createdAt", "desc"), 
                    limit(20)
                );
                
                const snap = await getDocs(q);
                
                if (snap.empty) {
                    empty.style.display = 'block';
                    return;
                }

                snap.forEach(doc => {
                    const data = doc.data();
                    const item = createNotifElement(data);
                    list.appendChild(item);
                });

            } catch (e) {
                console.error("Error fetching notifications", e);
                // For demo/production initial state, if collection doesn't exist:
                empty.style.display = 'block';
            }
        }

        function createNotifElement(data) {
            const div = document.createElement('div');
            div.className = 'notif-item';
            
            let iconClass = 'icon-system';
            let iconSvg = `<svg viewBox="0 0 24 24" style="fill: #64748b;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>`;

            if (data.type === 'like') {
                iconClass = 'icon-like';
                iconSvg = `<svg viewBox="0 0 24 24" style="fill: #ef4444;"><path d="M12 21.35L10.55 20.03C5.4 15.36 2 12.28 2 8.5C2 5.42 4.42 3 7.5 3C9.24 3 10.91 3.81 12 5.09C13.09 3.81 14.76 3 16.5 3C19.58 3 22 5.42 22 8.5C22 12.28 18.6 15.36 13.46 20.04L12 21.35Z"/></svg>`;
            }

            const time = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleDateString() : "Recently";

            div.innerHTML = `
                <div class="notif-icon ${iconClass}">${iconSvg}</div>
                <div class="notif-content">
                    <p class="notif-text">${data.message}</p>
                    <p class="notif-time">${time}</p>
                </div>
            `;
            return div;
        }
    </script>
</body>
</html>
