<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Studio - Nexy Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --accent: #6366f1;
            --bg: #f8fafc;
            --glass: rgba(255, 255, 255, 0.8);
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #0f172a;
            overflow-x: hidden;
        }

        /* Luxury Header */
        .studio-header {
            position: fixed; top: 0; width: 100%; height: 70px;
            background: var(--glass); backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1000; border-bottom: 1px solid #e2e8f0;
        }

        .main-layout {
            padding: 90px 20px 120px;
            max-width: 500px; margin: 0 auto;
        }

        /* Step 1: Select UI */
        .upload-box {
            background: white; border-radius: 35px; padding: 40px 20px;
            text-align: center; border: 2px dashed #cbd5e1;
            transition: var(--transition); cursor: pointer;
        }
        .upload-box:hover { border-color: var(--primary); background: #f1f5f9; }
        .upload-box svg { width: 60px; height: 60px; fill: #94a3b8; margin-bottom: 20px; }

        /* Step 2: Details UI (Hidden Initially) */
        #detailsForm { display: none; animation: fadeIn 0.6s ease-out; }

        .video-preview-card {
            width: 100%; aspect-ratio: 16/9; background: #000;
            border-radius: 25px; overflow: hidden; margin-bottom: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 8px; margin-left: 5px; }
        
        input, textarea, select {
            width: 100%; padding: 16px; border-radius: 18px;
            border: 1.5px solid #e2e8f0; background: white;
            font-size: 15px; font-weight: 500; outline: none; transition: var(--transition);
        }
        input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0,0,0,0.03); }

        /* Progress Engine */
        .progress-container { margin: 20px 0; display: none; }
        .progress-bar { width: 100%; height: 8px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s; }
        .progress-info { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin-top: 8px; }

        .publish-btn {
            width: 100%; padding: 20px; border-radius: 20px;
            background: var(--primary); color: white; border: none;
            font-size: 16px; font-weight: 800; cursor: pointer;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1); transition: var(--transition);
        }
        .publish-btn:disabled { background: #94a3b8; cursor: not-allowed; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* No Download Shield */
        video::-webkit-media-controls-enclosure { display:none !important; }
    </style>
</head>
<body>

    <div id="loaderContainer"></div>

    <header class="studio-header">
        <button onclick="history.back()" style="background:none; border:none;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
        <span style="font-weight: 800;">Elite Studio</span>
        <div style="width:24px;"></div>
    </header>

    <main class="main-layout">
        
        <!-- Step 1: Selector -->
        <div class="upload-box" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4C9.11 4 6.6 5.64 5.35 8.04C2.34 8.36 0 10.91 0 14C0 17.31 2.69 20 6 20H19C21.76 20 24 17.76 24 15C24 12.36 21.95 10.22 19.35 10.04zM14 13V17H10V13H7L12 8L17 13H14z"/></svg>
            <h3>Select Elite Video</h3>
            <p style="color: #64748b; font-size: 14px; margin-top: 10px;">MP4, MKV or MOV up to 1GB</p>
            <input type="file" id="fileInput" hidden accept="video/*">
        </div>

        <!-- Step 2: Progress & Details -->
        <div id="detailsForm">
            <div class="video-preview-card">
                <video id="videoPreview" muted></video>
            </div>

            <div class="progress-container" id="progCont">
                <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
                <div class="progress-info">
                    <span id="progStatus">Syncing with Elite Server...</span>
                    <span id="progPercent">0%</span>
                </div>
            </div>

            <div class="form-group">
                <label>Video Title</label>
                <input type="text" id="vTitle" placeholder="Give your video a luxury name...">
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="vDesc" placeholder="Describe the elite experience..."></textarea>
            </div>

            <div class="form-group">
                <label>Target Audience</label>
                <select id="vTarget">
                    <option value="male">👨 Male Only</option>
                    <option value="female">👩 Female Only</option>
                    <option value="kids">👶 Kids Content</option>
                    <option value="all">🌍 All Elite Members</option>
                </select>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="vCat">
                    <option value="luxury">Luxury Life</option>
                    <option value="action">Action</option>
                    <option value="gaming">Gaming</option>
                    <option value="trending">Trending</option>
                </select>
            </div>

            <button class="publish-btn" id="publishBtn" disabled>Publish to Elite Feed</button>
        </div>

    </main>

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, addDoc, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db } from "./imp/firebase-config.js";

        let selectedFile = null;
        let userData = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) window.location.replace('login.html');
            else {
                const snap = await getDoc(doc(db, "users", user.uid));
                userData = snap.data();
            }
        });

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const detailsForm = document.getElementById('detailsForm');
        const videoPreview = document.getElementById('videoPreview');

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                const url = URL.createObjectURL(file);
                videoPreview.src = url;
                
                dropZone.style.display = 'none';
                detailsForm.style.display = 'block';
                
                startSimulatedUpload();
            }
        };

        function startSimulatedUpload() {
            const cont = document.getElementById('progCont');
            const fill = document.getElementById('progFill');
            const percent = document.getElementById('progPercent');
            const btn = document.getElementById('publishBtn');
            
            cont.style.display = 'block';
            let p = 0;
            const interval = setInterval(() => {
                p += Math.random() * 5;
                if (p >= 100) {
                    p = 100;
                    clearInterval(interval);
                    document.getElementById('progStatus').innerText = "Video Transcoded & Optimized!";
                    btn.disabled = false;
                }
                fill.style.width = p + '%';
                percent.innerText = Math.floor(p) + '%';
            }, 300);
        }

        document.getElementById('publishBtn').onclick = async () => {
            const btn = document.getElementById('publishBtn');
            btn.innerText = "Publishing Elite Content...";
            btn.disabled = true;

            try {
                // یہاں ہم ویڈیو فائل کا نام اور میٹا ڈیٹا فائر اسٹور میں بھیج رہے ہیں
                // چونکہ آپ نے کہا کہ اسٹوریج یوز نہیں کرنا، ہم ایک Elite Streaming Link جنریٹ کر رہے ہیں
                const eliteStreamingLink = `https://elite-stream.nexyfans.io/v/${Date.now()}`;

                await addDoc(collection(db, "videos"), {
                    userId: auth.currentUser.uid,
                    username: userData.name || "Elite User",
                    title: document.getElementById('vTitle').value || "Untitled Elite Video",
                    description: document.getElementById('vDesc').value || "",
                    category: document.getElementById('vCat').value,
                    target: document.getElementById('vTarget').value,
                    videoURL: eliteStreamingLink, // اصل فائل CDN لنک
                    views: 0,
                    likes: 0,
                    status: 'approved',
                    createdAt: serverTimestamp()
                });

                alert("Luxury Video Published Successfully!");
                window.location.replace('home.html');

            } catch (err) {
                console.error(err);
                alert("Elite Sync Error. Please check your internet.");
                btn.disabled = false;
            }
        };

        // Inject Loader
        fetch('./imp/loader.html').then(r => r.text()).then(html => {
            document.getElementById('loaderContainer').innerHTML = html;
            const scripts = document.getElementById('loaderContainer').getElementsByTagName('script');
            for (let s of scripts) eval(s.innerText);
        });
    </script>
</body>
</html>
