<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Studio - Nexy Hub</title>
    
    <!-- Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --accent: #6366f1;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .luxury-mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 0% 0%, #e2e8f0 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, #f1f5f9 0%, transparent 50%);
        }

        .container { width: 100%; max-width: 500px; padding: 40px 20px; }

        /* Header */
        .header-nav { display: flex; align-items: center; margin-bottom: 30px; }
        .back-btn { background: white; border: 1.5px solid var(--border); border-radius: 50%; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: var(--transition); }
        .back-btn:active { transform: scale(0.9); background: #f8fafc; }
        .header-nav h2 { flex: 1; text-align: center; font-size: 20px; font-weight: 800; margin-right: 45px; }

        /* Upload Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid white; border-radius: 35px; padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05);
        }

        /* Selector Area */
        .upload-selector {
            width: 100%; border: 2px dashed #cbd5e1; border-radius: 25px;
            padding: 40px 20px; text-align: center; cursor: pointer;
            transition: var(--transition); background: #fcfcfc;
        }
        .upload-selector:hover { border-color: var(--primary); background: #f8fafc; }
        .upload-selector svg { width: 50px; height: 50px; fill: #94a3b8; margin-bottom: 15px; }
        .upload-selector h3 { font-size: 16px; font-weight: 700; margin-bottom: 5px; }
        .upload-selector p { font-size: 12px; color: #64748b; font-weight: 500; }

        /* Preview Area */
        .preview-box { display: none; width: 100%; position: relative; border-radius: 25px; overflow: hidden; background: #000; aspect-ratio: 9/16; margin-bottom: 25px; }
        .preview-box video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .remove-vid { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); border: none; color: white; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); }

        /* Form Styling */
        .form-section { margin-top: 25px; display: none; animation: slideIn 0.5s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 800; color: #475569; text-transform: uppercase; margin-bottom: 8px; margin-left: 5px; letter-spacing: 0.5px; }
        
        input, textarea, select {
            width: 100%; padding: 16px; border-radius: 18px; border: 1.5px solid #e2e8f0;
            background: white; font-size: 15px; font-weight: 500; outline: none; transition: var(--transition);
        }
        input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 5px rgba(0,0,0,0.03); }

        /* Progress Bar */
        .progress-container { display: none; margin: 25px 0; }
        .progress-info { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 10px; }
        .progress-track { width: 100%; height: 8px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: var(--primary); border-radius: 10px; transition: width 0.3s ease; }

        /* Submit Button */
        .btn-elite {
            width: 100%; padding: 18px; border-radius: 20px; background: var(--primary);
            color: white; font-size: 16px; font-weight: 800; border: none; cursor: pointer;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1); transition: var(--transition);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-elite:active { transform: scale(0.96); }
        .btn-elite:disabled { background: #94a3b8; cursor: not-allowed; }

        .spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="luxury-mesh"></div>

    <div class="container">
        <nav class="header-nav">
            <div class="back-btn" onclick="history.back()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </div>
            <h2>Elite Studio</h2>
        </nav>

        <div class="glass-card">
            <!-- Video Picker -->
            <div class="upload-selector" id="dropZone" onclick="document.getElementById('fileInput').click()">
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04C2.34 8.36 0 10.91 0 14C0 17.31 2.69 20 6 20H19C21.76 20 24 17.76 24 15C24 12.36 21.95 10.22 19.35 10.04ZM14 13V17H10V13H7L12 8L17 13H14Z"/></svg>
                <h3>Choose Luxury Video</h3>
                <p>Support for 4K / 1GB+ files</p>
                <input type="file" id="fileInput" hidden accept="video/*">
            </div>

            <!-- Preview -->
            <div class="preview-box" id="previewBox">
                <button class="remove-vid" id="removeVid">
                    <svg width="18" height="18" fill="white" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z"/></svg>
                </button>
                <video id="videoPreview" autoplay muted loop playsinline></video>
            </div>

            <!-- Form -->
            <div class="form-section" id="formSection">
                <div class="group">
                    <label>Elite Title</label>
                    <input type="text" id="videoTitle" placeholder="Catchy title for your elite content...">
                </div>

                <div class="group">
                    <label>Elite Description</label>
                    <textarea id="videoDesc" placeholder="Tell the world about your luxury vibe..." rows="3"></textarea>
                </div>

                <div style="display: flex; gap: 12px;">
                    <div class="group" style="flex: 1;">
                        <label>Category</label>
                        <select id="category">
                            <option value="luxury">Luxury</option>
                            <option value="action">Action</option>
                            <option value="life">Life Style</option>
                            <option value="gaming">Gaming</option>
                        </select>
                    </div>
                    <div class="group" style="flex: 1;">
                        <label>Target</label>
                        <select id="target">
                            <option value="male">Elite Male</option>
                            <option value="female">Elite Female</option>
                            <option value="kids">Kids Hub</option>
                        </select>
                    </div>
                </div>

                <div class="group">
                    <label>Tags (Comma separated)</label>
                    <input type="text" id="tags" placeholder="luxury, viral, elite, trending">
                </div>

                <!-- Progress -->
                <div class="progress-container" id="progressContainer">
                    <div class="progress-info">
                        <span id="statusTxt">Optimizing Video...</span>
                        <span id="percent">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>

                <button class="btn-elite" id="publishBtn">
                    <span>Publish Elite Post</span>
                    <div class="spinner" id="btnSpinner"></div>
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase System -->
    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        import { collection, addDoc, doc, updateDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db, storage } from "./imp/firebase-config.js";

        let currentUser = null;
        let selectedFile = null;

        // 1. Auth Check
        onAuthStateChanged(auth, async (user) => {
            if (!user) window.location.replace("login.html");
            else {
                const snap = await getDoc(doc(db, "users", user.uid));
                currentUser = snap.exists() ? snap.data() : user;
            }
        });

        // 2. File Selection & Preview
        const fileInput = document.getElementById('fileInput');
        const previewBox = document.getElementById('previewBox');
        const dropZone = document.getElementById('dropZone');
        const formSection = document.getElementById('formSection');
        const videoPreview = document.getElementById('videoPreview');

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file || !file.type.startsWith('video/')) return;
            
            selectedFile = file;
            videoPreview.src = URL.createObjectURL(file);
            
            dropZone.style.display = 'none';
            previewBox.style.display = 'block';
            formSection.style.display = 'block';
        };

        document.getElementById('removeVid').onclick = () => {
            selectedFile = null;
            location.reload();
        };

        // 3. Optimized Publish Logic
        document.getElementById('publishBtn').onclick = async () => {
            if (!selectedFile || !currentUser) return;

            const publishBtn = document.getElementById('publishBtn');
            const spinner = document.getElementById('btnSpinner');
            const progCont = document.getElementById('progressContainer');
            const progFill = document.getElementById('progressFill');
            const percent = document.getElementById('percent');
            const statusTxt = document.getElementById('statusTxt');

            publishBtn.disabled = true;
            publishBtn.querySelector('span').style.display = 'none';
            spinner.style.display = 'block';
            progCont.style.display = 'block';

            const title = document.getElementById('videoTitle').value || "Elite Luxury Video";
            const desc = document.getElementById('videoDesc').value || "";
            const category = document.getElementById('category').value;
            const target = document.getElementById('target').value;
            const tags = document.getElementById('tags').value.split(',').map(t => t.trim().toLowerCase());

            try {
                // Generate secure filename
                const fileName = `elite_hub/${currentUser.uid}/${Date.now()}_nexy.mp4`;
                const storageRef = ref(storage, fileName);
                
                // Start High-Performance Upload
                const uploadTask = uploadBytesResumable(storageRef, selectedFile);

                uploadTask.on('state_changed', 
                    (snapshot) => {
                        const prog = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                        progFill.style.width = prog + '%';
                        percent.innerText = Math.round(prog) + '%';
                        if(prog < 99) statusTxt.innerText = "Syncing with CDN...";
                        else statusTxt.innerText = "Finalizing Elite Stream...";
                    }, 
                    (error) => { alert("Upload failed: " + error.message); location.reload(); }, 
                    async () => {
                        const finalURL = await getDownloadURL(uploadTask.snapshot.ref);
                        
                        // Save Metadata to Firestore (Optimized for Search)
                        await addDoc(collection(db, "videos"), {
                            userId: currentUser.uid,
                            username: currentUser.name || "Elite Creator",
                            title: title,
                            title_lowercase: title.toLowerCase(),
                            description: desc,
                            category: category,
                            target: target,
                            tags: tags,
                            videoURL: finalURL, // In production, this would be the transcoded HLS link
                            views: 0,
                            likes: 0,
                            status: "approved", // User request: auto publish
                            createdAt: serverTimestamp()
                        });

                        // Update Last Upload for the 7-day rule
                        await updateDoc(doc(db, "users", currentUser.uid), {
                            lastUploadDate: serverTimestamp()
                        });

                        window.location.replace('home.html');
                    }
                );

            } catch (err) {
                console.error(err);
                alert("Something went wrong with the elite hub.");
            }
        };

        // Anti-Download Security
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.querySelectorAll('video').forEach(v => {
            v.setAttribute('controlsList', 'nodownload nofullscreen noremoteplayback');
            v.disablePictureInPicture = true;
        });

    </script>
</body>
</html>
