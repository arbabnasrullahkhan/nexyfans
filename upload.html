<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Creator Studio - Nexy Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --accent: #6366f1;
            --bg: #f8fafc;
            --glass: rgba(255, 255, 255, 0.9);
            --border: #e2e8f0;
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- LUXURY HEADER --- */
        .studio-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: var(--glass); backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1000; border-bottom: 1px solid var(--border);
        }

        .back-btn { background: none; border: none; cursor: pointer; }

        /* --- MAIN CONTAINER --- */
        .studio-content {
            padding: 90px 20px 100px;
            max-width: 600px; margin: 0 auto; width: 100%;
        }

        /* --- STEP 1: UPLOAD ZONE --- */
        .upload-zone {
            width: 100%; aspect-ratio: 16/9; background: white;
            border: 2px dashed var(--border); border-radius: 30px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition); text-align: center;
            padding: 20px;
        }

        .upload-zone:active { transform: scale(0.98); background: #f1f5f9; }

        .upload-zone svg { width: 60px; height: 60px; fill: #cbd5e1; margin-bottom: 15px; }

        /* --- STEP 2: PREVIEW & DETAILS (Hidden initially) --- */
        #editorSection { display: none; animation: slideUp 0.6s var(--transition); }

        .preview-card {
            width: 100%; aspect-ratio: 16/9; background: #000;
            border-radius: 30px; overflow: hidden; margin-bottom: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); position: relative;
        }

        video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

        /* --- FORM STYLING --- */
        .luxury-form { background: white; padding: 30px; border-radius: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }

        .field { margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 10px; margin-left: 5px; }

        input, textarea, select {
            width: 100%; padding: 16px; border-radius: 18px; border: 1.5px solid var(--border);
            background: #f8fafc; font-size: 15px; font-family: inherit; font-weight: 600;
            outline: none; transition: var(--transition);
        }

        input:focus, textarea:focus { border-color: var(--primary); background: white; }

        .tag-input { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .tag { background: #e2e8f0; padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; }

        /* --- PUBLISH BUTTON --- */
        .publish-btn {
            width: 100%; padding: 20px; border-radius: 20px; background: var(--primary);
            color: white; border: none; font-size: 16px; font-weight: 800;
            cursor: pointer; margin-top: 20px; transition: var(--transition);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }

        .publish-btn:disabled { background: #94a3b8; cursor: wait; }

        /* --- MODAL / LOADER --- */
        #processingModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(20px);
            z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center;
        }

        .spinner { width: 50px; height: 50px; border: 5px solid #f1f5f9; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div id="loaderContainer"></div>

    <header class="studio-header">
        <button class="back-btn" onclick="history.back()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <span style="font-weight: 800; font-size: 18px;">Elite Studio</span>
        <div style="width: 24px;"></div>
    </header>

    <main class="studio-content">
        
        <!-- Step 1: Select Video -->
        <input type="file" id="videoInput" accept="video/*" style="display: none;">
        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('videoInput').click()">
            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04C2.34 8.36 0 10.91 0 14C0 17.31 2.69 20 6 20H19c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
            <h2 style="font-weight: 800; font-size: 20px;">Upload Local Gallery</h2>
            <p style="color: #64748b; font-size: 14px; margin-top: 8px;">Select high-quality videos up to 2GB</p>
        </div>

        <!-- Step 2: Details & Publish -->
        <div id="editorSection">
            <div class="preview-card">
                <video id="videoPreview" autoplay muted loop playsinline></video>
                <div style="position: absolute; bottom: 15px; left: 15px; padding: 5px 12px; background: rgba(0,0,0,0.5); color: white; border-radius: 10px; font-size: 12px; font-weight: 700;">
                    PREVIEW MODE
                </div>
            </div>

            <div class="luxury-form">
                <div class="field">
                    <label>Elite Title</label>
                    <input type="text" id="vTitle" placeholder="Give your video a premium name..." required>
                </div>

                <div class="field">
                    <label>Elite Description</label>
                    <textarea id="vDesc" rows="3" placeholder="Share the story behind this luxury content..."></textarea>
                </div>

                <div style="display: flex; gap: 15px;">
                    <div class="field" style="flex: 1;">
                        <label>Category</label>
                        <select id="vCategory">
                            <option value="Action">Action</option>
                            <option value="Luxury">Luxury</option>
                            <option value="Music">Music</option>
                            <option value="Gaming">Gaming</option>
                        </select>
                    </div>
                    <div class="field" style="flex: 1;">
                        <label>Target Audience</label>
                        <select id="vTarget">
                            <option value="male">Male 👨</option>
                            <option value="female">Female 👩</option>
                            <option value="kids">Kids 👶</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label>Elite Tags (Separate by space)</label>
                    <input type="text" id="vTags" placeholder="e.g. #luxury #fast #nexy">
                </div>

                <button class="publish-btn" id="publishBtn">
                    <span>Publish to Feed</span>
                    <svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>

    </main>

    <!-- Processing Modal -->
    <div id="processingModal">
        <div class="spinner"></div>
        <h2 style="font-weight: 800; margin-top: 25px; font-size: 20px;">Elite Compression</h2>
        <p style="color: #64748b; margin-top: 10px; font-size: 14px; text-align: center; padding: 0 40px;">Please wait while we optimize your high-quality video for secure streaming...</p>
        <div id="progressText" style="margin-top: 20px; font-weight: 800; color: var(--accent);">0%</div>
    </div>

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, addDoc, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db } from "./imp/firebase-config.js";

        let currentUser = null;
        let videoDataUrl = ""; 

        onAuthStateChanged(auth, async (user) => {
            if (!user) window.location.replace("login.html");
            else {
                const snap = await getDoc(doc(db, "users", user.uid));
                currentUser = snap.data();
            }
        });

        // 1. File Handling
        const vInput = document.getElementById('videoInput');
        const vPreview = document.getElementById('videoPreview');
        const uploadZone = document.getElementById('uploadZone');
        const editor = document.getElementById('editorSection');

        vInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Generate Preview
            videoDataUrl = URL.createObjectURL(file);
            vPreview.src = videoDataUrl;
            
            uploadZone.style.display = 'none';
            editor.style.display = 'block';
        };

        // 2. Publish Logic
        document.getElementById('publishBtn').onclick = async () => {
            const title = document.getElementById('vTitle').value;
            if (!title) { alert("Please enter an Elite Title."); return; }

            const modal = document.getElementById('processingModal');
            const progress = document.getElementById('progressText');
            modal.style.display = 'flex';

            // --- SIMULATED ELITE TRANSCODING / UPLOAD ---
            let p = 0;
            const interval = setInterval(async () => {
                p += Math.floor(Math.random() * 15);
                if (p > 100) p = 100;
                progress.innerText = p + "%";

                if (p === 100) {
                    clearInterval(interval);
                    await finalPublish();
                }
            }, 300);
        };

        async function finalPublish() {
            try {
                // نوٹ: یہاں ہم ویڈیو فائل اسٹوریج میں نہیں بھیج رہے بلکہ 
                // ایک 'Streaming Link' اور تمام میٹا ڈیٹا Firestore میں سیو کر رہے ہیں۔
                // اصل سسٹم میں یہاں آپ کا CDN اسٹریمنگ لنک آئے گا۔
                
                const eliteVideoData = {
                    userId: auth.currentUser.uid,
                    username: currentUser.name || "Elite Creator",
                    title: document.getElementById('vTitle').value,
                    description: document.getElementById('vDesc').value,
                    category: document.getElementById('vCategory').value,
                    target: document.getElementById('vTarget').value,
                    tags: document.getElementById('vTags').value,
                    videoURL: videoDataUrl, // یہ عارضی ہے، رئیل ایپ میں یہاں CDN لنک سیو ہوگا
                    views: 0,
                    likes: 0,
                    status: 'approved',
                    createdAt: serverTimestamp()
                };

                await addDoc(collection(db, "videos"), eliteVideoData);
                
                // Update Last Upload Date for 7-day rule
                await updateDoc(doc(db, "users", auth.currentUser.uid), {
                    lastUploadDate: serverTimestamp()
                });

                window.location.replace("home.html");

            } catch (err) {
                console.error(err);
                alert("Elite Sync Error. Please retry.");
                document.getElementById('processingModal').style.display = 'none';
            }
        }

        // Inject Loader
        fetch('./imp/loader.html').then(r => r.text()).then(html => {
            document.getElementById('loaderContainer').innerHTML = html;
            const scripts = document.getElementById('loaderContainer').getElementsByTagName('script');
            for (let s of scripts) eval(s.innerText);
        });
    </script>
</body>
</html>
