<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Studio - Nexy Hub</title>
    
    <!-- Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #000000;
            --accent: #d4af37; /* Luxury Gold */
            --bg: #f8fafc;
            --glass: rgba(255, 255, 255, 0.8);
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #0f172a;
            overflow-x: hidden;
        }

        /* --- LUXURY HEADER --- */
        .studio-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: var(--glass); backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; border-bottom: 1px solid #e2e8f0;
        }

        .header-content { width: 100%; max-width: 500px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .back-btn { background: none; border: none; cursor: pointer; }
        .header-title { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }

        /* --- MAIN LAYOUT --- */
        .main-layout { padding: 90px 20px 120px; max-width: 550px; margin: 0 auto; }

        @media (min-width: 768px) { body { padding-left: 80px; } }

        /* --- CREATOR IDENTITY CARD --- */
        .creator-identity {
            background: var(--primary); color: white; padding: 20px;
            border-radius: 24px; margin-bottom: 30px; display: flex; align-items: center; gap: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            animation: fadeIn 0.8s ease-out;
        }

        .creator-avatar {
            width: 50px; height: 50px; background: var(--accent); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-weight: 800; color: black;
        }

        .creator-details h4 { font-size: 14px; opacity: 0.7; font-weight: 500; }
        .creator-details h3 { font-size: 18px; font-weight: 800; }

        /* --- UPLOAD FORM --- */
        .glass-card {
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid white; border-radius: 30px; padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.03);
            animation: slideUp 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 8px; margin-left: 5px; }

        input, select, textarea {
            width: 100%; padding: 16px; border-radius: 18px; border: 1.5px solid #e2e8f0;
            background: white; font-size: 15px; font-weight: 600; outline: none; transition: var(--transition);
        }

        input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1); }

        textarea { height: 100px; resize: none; }

        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }

        /* --- PUBLISH BUTTON --- */
        .btn-publish {
            width: 100%; padding: 20px; border-radius: 20px; background: var(--primary);
            color: white; border: none; font-size: 16px; font-weight: 800;
            cursor: pointer; transition: var(--transition); margin-top: 10px;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }

        .btn-publish:active { transform: scale(0.96); opacity: 0.9; }
        .btn-publish svg { fill: var(--accent); }

        /* --- SUCCESS MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(15px);
            display: none; justify-content: center; align-items: center; z-index: 2000; padding: 24px;
        }

        .modal {
            background: white; padding: 40px 30px; border-radius: 35px; width: 100%; max-width: 380px;
            text-align: center; animation: modalPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-icon { width: 80px; height: 80px; background: #f0fdf4; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; }
        .modal-icon svg { width: 40px; height: 40px; fill: #22c55e; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .spinner { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="navDockContainer"></div>
    <div id="loaderContainer"></div>

    <header class="studio-header">
        <div class="header-content">
            <button class="back-btn" onclick="history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <span class="header-title">Elite Studio</span>
            <div style="width: 24px;"></div>
        </div>
    </header>

    <main class="main-layout">
        
        <!-- Creator Identity Card -->
        <div class="creator-identity">
            <div class="creator-avatar" id="creatorAvatar">U</div>
            <div class="creator-details">
                <h4>Posting as</h4>
                <h3 id="creatorName">Loading Elite Name...</h3>
            </div>
        </div>

        <div class="glass-card">
            <form id="uploadForm">
                <div class="form-group">
                    <label>Video Elite Link (URL)</label>
                    <input type="url" id="vUrl" placeholder="Enter video link (Instagram, YT, or Direct)" required>
                </div>

                <div class="form-group">
                    <label>Elite Title</label>
                    <input type="text" id="vTitle" placeholder="Give your content a title..." required>
                </div>

                <div class="form-group">
                    <label>Elite Description</label>
                    <textarea id="vDesc" placeholder="Explain your elite vibe..."></textarea>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="vCategory">
                            <option value="luxury">Luxury Life</option>
                            <option value="trending">Trending</option>
                            <option value="gaming">Gaming</option>
                            <option value="community">Community</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Target Audience</label>
                        <select id="vTarget">
                            <option value="male">Elite Male</option>
                            <option value="female">Elite Female</option>
                            <option value="kids">Elite Kids</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 8px; text-transform: none; color: var(--primary);">
                        <input type="checkbox" style="width: 18px; height: 18px;" required>
                        I confirm this content is 18+ safe.
                    </label>
                </div>

                <button type="submit" class="btn-publish" id="publishBtn">
                    <span>Publish to Hub</span>
                    <div class="spinner" id="btnSpinner"></div>
                    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M2.01 21L23 12L2.01 3L2 10L17 12L2 14L2.01 21Z"/></svg>
                </button>
            </form>
        </div>
    </main>

    <!-- Success Modal -->
    <div class="modal-overlay" id="successModal">
        <div class="modal">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
            </div>
            <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 10px;">Elite Published!</h2>
            <p style="color: #64748b; font-size: 15px; margin-bottom: 30px;">Your content is now live on Nexy Hub. Start gaining elite views.</p>
            <button class="btn-publish" onclick="window.location.href='home.html'">Return to Hub</button>
        </div>
    </div>

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db } from "./imp/firebase-config.js";

        let currentEliteUser = null;

        // 1. Auth Sync
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.replace("login.html");
            } else {
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists()) {
                    currentEliteUser = snap.data();
                    document.getElementById('creatorName').innerText = currentEliteUser.name || "Elite Creator";
                    document.getElementById('creatorAvatar').innerText = (currentEliteUser.name || "E").charAt(0).toUpperCase();
                }
            }
        });

        // 2. Publish Logic
        const form = document.getElementById('uploadForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('publishBtn');
            const spinner = document.getElementById('btnSpinner');
            
            btn.children[0].style.display = 'none';
            btn.children[2].style.display = 'none';
            spinner.style.display = 'block';

            const videoData = {
                videoURL: document.getElementById('vUrl').value,
                title: document.getElementById('vTitle').value,
                desc: document.getElementById('vDesc').value,
                category: document.getElementById('vCategory').value,
                target: document.getElementById('vTarget').value,
                userId: currentEliteUser.uid,
                username: currentEliteUser.name,
                views: 0,
                likes: 0,
                status: 'approved', // Auto-approved for this version
                createdAt: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "videos"), videoData);
                document.getElementById('successModal').style.display = 'flex';
            } catch (err) {
                alert("Upload Failed: " + err.message);
                btn.children[0].style.display = 'block';
                btn.children[2].style.display = 'block';
                spinner.style.display = 'none';
            }
        });

        // Inject Nav & Loader
        const inject = (url, target) => {
            fetch(url).then(r => r.text()).then(html => {
                document.getElementById(target).innerHTML = html;
                const scripts = document.getElementById(target).getElementsByTagName('script');
                for (let s of scripts) eval(s.innerText);
            });
        };
        inject('./imp/nav-dock-button.html', 'navDockContainer');
        inject('./imp/loader.html', 'loaderContainer');
    </script>
</body>
</html>
