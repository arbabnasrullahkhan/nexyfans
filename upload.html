<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upload - Nexy Fans</title>
    <meta name="theme-color" content="#ffffff">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #1a1a1a;
            overflow-x: hidden;
        }

        /* Top Header */
        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            z-index: 900;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-weight: 600;
            font-size: 16px;
        }

        /* Main Layout */
        .main-layout {
            padding-top: 80px;
            padding-bottom: 100px; /* Space for nav dock */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media (min-width: 768px) {
            .top-header {
                padding-left: 80px; /* Offset for desktop sidebar */
            }
            .main-layout {
                padding-left: 80px; /* Offset for desktop sidebar */
            }
        }

        .upload-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            margin: 0 16px;
        }

        /* Drag & Drop Zone */
        .drop-zone {
            width: 100%;
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f8fafc;
            position: relative;
            overflow: hidden;
        }

        .drop-zone.dragover {
            border-color: #1a1a1a;
            background: #f1f5f9;
        }

        .drop-zone svg {
            width: 48px;
            height: 48px;
            fill: #64748b;
            margin-bottom: 12px;
            transition: fill 0.2s;
        }

        .drop-zone.dragover svg {
            fill: #1a1a1a;
        }

        .drop-zone h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .drop-zone p {
            font-size: 13px;
            color: #64748b;
        }

        #fileInput {
            display: none;
        }

        /* Video Preview */
        .preview-container {
            display: none;
            width: 100%;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/5;
        }

        .preview-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-video {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .remove-video svg {
            width: 16px;
            height: 16px;
            fill: white;
        }

        /* Form Details */
        .form-group {
            margin-top: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            background: #ffffff;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: #1a1a1a;
            transition: all 0.2s ease;
            outline: none;
            resize: none;
            height: 100px;
        }

        textarea:focus {
            border-color: #1a1a1a;
            box-shadow: 0 0 0 4px rgba(26, 26, 26, 0.05);
        }

        /* Progress Bar */
        .progress-wrapper {
            display: none;
            margin-top: 24px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #475569;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #1a1a1a, #4a4a4a);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            border: none;
            background: #1a1a1a;
            color: #ffffff;
            margin-top: 24px;
            transition: transform 0.2s ease, opacity 0.2s ease;
            display: none;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        /* Error/Success Messages */
        .msg-box {
            font-size: 13px;
            margin-top: 16px;
            text-align: center;
            display: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 500;
        }

        .error-msg { color: #ef4444; background: #fef2f2; }
        .success-msg { color: #059669; background: #ecfdf5; }
    </style>
</head>
<body>

    <!-- Navigation Dock Container -->
    <div id="navDockContainer"></div>

    <!-- Header -->
    <header class="top-header">
        Upload Video
    </header>

    <!-- Main Layout -->
    <main class="main-layout">
        <div class="upload-container">
            
            <!-- File Input & Drop Zone -->
            <input type="file" id="fileInput" accept="video/mp4,video/x-m4v,video/*" />
            
            <div class="drop-zone" id="dropZone">
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4C9.11 4 6.6 5.64 5.35 8.04C2.34 8.36 0 10.91 0 14C0 17.31 2.69 20 6 20H19C21.76 20 24 17.76 24 15C24 12.36 21.95 10.22 19.35 10.04ZM14 13V17H10V13H7L12 8L17 13H14Z"/></svg>
                <h3>Select a video to upload</h3>
                <p>Or drag and drop it here</p>
                <p style="margin-top: 8px; font-size: 11px;">MP4 or WebM • Max 50MB</p>
            </div>

            <!-- Video Preview -->
            <div class="preview-container" id="previewContainer">
                <button class="remove-video" id="removeVideoBtn" title="Remove Video">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z"/></svg>
                </button>
                <video id="videoPreview" controls playsinline></video>
            </div>

            <!-- Upload Form -->
            <div id="uploadFormContainer" style="display: none;">
                <div class="form-group">
                    <label>Caption</label>
                    <textarea id="videoCaption" placeholder="Write a catchy caption... #trends" maxlength="150"></textarea>
                </div>

                <!-- Progress Bar -->
                <div class="progress-wrapper" id="progressWrapper">
                    <div class="progress-header">
                        <span id="progressText">Uploading...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>

                <div id="statusMsg" class="msg-box"></div>

                <button class="btn-primary" id="uploadBtn">Publish Video</button>
            </div>

        </div>
    </main>

    <!-- App Logic -->
    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        import { collection, addDoc, doc, updateDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db, storage } from "./imp/firebase-config.js";

        let currentUser = null;
        let selectedFile = null;

        // 1. Check Authentication
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.replace("login.html");
            } else {
                // Fetch extra user details (username) from Firestore
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    currentUser = userDoc.data();
                } else {
                    currentUser = { id: user.uid, username: "User" };
                }
            }
        });

        // 2. Inject Navigation Dock
        async function loadNavDock() {
            try {
                const response = await fetch('./imp/nav-dock-button.html');
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById('navDockContainer').innerHTML = html;
                    const scripts = document.getElementById('navDockContainer').getElementsByTagName('script');
                    for (let script of scripts) eval(script.innerText);
                }
            } catch (error) { console.error("Nav load failed", error); }
        }
        loadNavDock();

        // 3. UI Elements
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const videoPreview = document.getElementById('videoPreview');
        const removeVideoBtn = document.getElementById('removeVideoBtn');
        const uploadFormContainer = document.getElementById('uploadFormContainer');
        const uploadBtn = document.getElementById('uploadBtn');
        const videoCaption = document.getElementById('videoCaption');
        const progressWrapper = document.getElementById('progressWrapper');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const statusMsg = document.getElementById('statusMsg');

        // 4. Handle Drag & Drop Events
        dropZone.addEventListener('click', () => fileInput.click());
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        });

        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });

        // 5. File Validation & Preview
        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];

            // Validate video type
            if (!file.type.startsWith('video/')) {
                showMsg('Please select a valid video file.', 'error');
                return;
            }

            // Validate size (Max 50MB)
            const maxSize = 50 * 1024 * 1024;
            if (file.size > maxSize) {
                showMsg('Video exceeds the 50MB limit.', 'error');
                return;
            }

            selectedFile = file;
            showMsg('', ''); // Clear messages
            
            // Show Preview
            const videoURL = URL.createObjectURL(file);
            videoPreview.src = videoURL;
            dropZone.style.display = 'none';
            previewContainer.style.display = 'block';
            uploadFormContainer.style.display = 'block';
            uploadBtn.style.display = 'block';
        }

        // 6. Remove Video
        removeVideoBtn.addEventListener('click', () => {
            selectedFile = null;
            videoPreview.src = "";
            previewContainer.style.display = 'none';
            uploadFormContainer.style.display = 'none';
            dropZone.style.display = 'block';
            fileInput.value = ""; // Reset input
        });

        // Message Helper
        function showMsg(text, type) {
            if (!text) {
                statusMsg.style.display = 'none';
                return;
            }
            statusMsg.textContent = text;
            statusMsg.className = `msg-box ${type}-msg`;
            statusMsg.style.display = 'block';
        }

        // 7. Handle Upload to Firebase
        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile || !currentUser) return;

            // UI changes during upload
            uploadBtn.disabled = true;
            removeVideoBtn.style.display = 'none';
            progressWrapper.style.display = 'block';
            showMsg('', '');

            try {
                // Generate a unique file name
                const timestamp = Date.now();
                const safeName = selectedFile.name.replace(/[^a-zA-Z0-9.]/g, "_");
                const fileName = `videos/${currentUser.id}/${timestamp}_${safeName}`;
                
                // Create Storage Reference
                const storageRef = ref(storage, fileName);
                
                // Start Upload Task
                const uploadTask = uploadBytesResumable(storageRef, selectedFile);

                uploadTask.on('state_changed', 
                    (snapshot) => {
                        // Calculate Progress
                        const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                        progressFill.style.width = progress + '%';
                        progressPercent.innerText = Math.round(progress) + '%';
                    }, 
                    (error) => {
                        console.error("Upload error:", error);
                        showMsg('Upload failed. Please try again.', 'error');
                        uploadBtn.disabled = false;
                        removeVideoBtn.style.display = 'flex';
                        progressWrapper.style.display = 'none';
                    }, 
                    async () => {
                        // Upload Success - Get URL
                        const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                        
                        // Save Data to Firestore
                        await saveVideoData(downloadURL);
                    }
                );

            } catch (error) {
                console.error("Initialization error:", error);
                showMsg('Something went wrong.', 'error');
                uploadBtn.disabled = false;
            }
        });

        // 8. Save Data to Firestore Collection
        async function saveVideoData(videoURL) {
            try {
                const title = videoCaption.value.trim();

                // 8a. Add to "videos" collection
                // Status is set to 'pending' to follow your admin moderation rules
                await addDoc(collection(db, "videos"), {
                    userId: currentUser.id,
                    username: currentUser.username,
                    title: title,
                    videoURL: videoURL,
                    thumbnail: "", // Auto-thumbnail logic can go in Cloud Functions
                    views: 0,
                    likes: 0,
                    status: "pending", 
                    createdAt: serverTimestamp()
                });

                // 8b. Update User's lastUploadDate (For Weekly Activity Rule)
                const userRef = doc(db, "users", currentUser.id);
                await updateDoc(userRef, {
                    lastUploadDate: serverTimestamp(),
                    status: "active" // Ensures they are not suspended if they just uploaded
                });

                showMsg('Video uploaded successfully! Waiting for moderation.', 'success');
                
                // Redirect to Profile after 2 seconds
                setTimeout(() => {
                    window.location.replace('profile.html');
                }, 2000);

            } catch (error) {
                console.error("Database save error:", error);
                showMsg('Failed to save video data.', 'error');
                uploadBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
